<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina da Lua | Taylise Ink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuração de Cores e Fontes inspiradas no Logo -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fundo: '#202a36',
                        card: '#2b3847', 
                        ouro: '#dca868', 
                        ouroclaro: '#f4ce83',
                        texto: '#e2e8f0',
                        adminbg: '#111827', // Fundo mais escuro para o admin
                        admincard: '#1f2937' // Card do admin
                    },
                    fontFamily: {
                        serif: ['"Cinzel Decorative"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                        hand: ['"Dancing Script"', 'cursive']
                    }
                }
            }
        }
    </script>

    <!-- React e Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- FIREBASE (Deixei preparado para quando você for usar) -->
    <!-- 
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            // SUAS CHAVES ENTRARÃO AQUI
        };
        const app = initializeApp(firebaseConfig);
        // window.auth = getAuth(app);
        // window.db = getFirestore(app);
    </script> 
    -->

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Dancing+Script:wght@400;700&family=Inter:wght@300;400;600&display=swap');
        
        body {
            background-color: #202a36;
            color: #e2e8f0;
            margin: 0;
            overflow-x: hidden;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }

        .glass-nav {
            background: rgba(32, 42, 54, 0.9);
            backdrop-filter: blur(15px);
            border-color: rgba(220, 168, 104, 0.2);
        }

        .paper-texture {
            background-image: url('https://www.transparenttextures.com/patterns/handmade-paper.png');
            mix-blend-mode: overlay;
        }

        .fade-in { animation: fadeIn 0.8s ease-out forwards; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-input {
            background: #2b3847;
            border: 1px solid rgba(220, 168, 104, 0.3);
            color: white;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            outline: none;
            transition: border 0.3s;
        }
        .form-input:focus { border-color: #dca868; }

        /* Estilos específicos para o painel Admin */
        .admin-input {
            background: #374151;
            border: 1px solid #4b5563;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            width: 100%;
            outline: none;
            font-size: 0.875rem;
        }
        .admin-input:focus { border-color: #dca868; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-fundo text-texto font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- COMPONENTE LOGO (COM LINK DO GOOGLE DRIVE CORRIGIDO) ---
        const LogoOficina = ({ size = 80 }) => {
            // ID extraído do seu link: 1Hxt6UiA_FTS_iFwxhOTRM5HO3CXc27qs
            const driveImageUrl = "https://drive.google.com/uc?export=view&id=1Hxt6UiA_FTS_iFwxhOTRM5HO3CXc27qs";
            
            return (
                <div className="relative animate-float flex items-center justify-center" style={{ width: size, height: size }}>
                    <img 
                        src={driveImageUrl} 
                        alt="Logo Oficina da Lua" 
                        className="w-full h-full object-contain drop-shadow-[0_0_15px_rgba(220,168,104,0.4)]"
                        onError={(e) => {
                            e.target.onerror = null; 
                            e.target.src = "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0MCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZGNhODY4IiBzdHJva2Utd2lkdGg9IjIiLz48dGV4dCB4PSI1MCIgeT0iNTUiIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIiBmb250LXNpemU9IjEyIiBmaWxsPSIjZGNhODY4IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5Mb2dvPC90ZXh0Pjwvc3ZnPg==";
                        }}
                    />
                </div>
            );
        };

        // ==========================================
        // ÁREA PÚBLICA (O SITE QUE O CLIENTE VÊ)
        // ==========================================
        const PublicSite = ({ navigateToAdmin }) => {
            const [section, setSection] = useState('inicio');
            
            // Dados (Futuramente virão do Firebase)
            const [orderForm, setOrderForm] = useState({ name: '', type: 'Arte Personalizada', idea: '' });

            const arts = [
                { id: 1, name: "Incensário Artesanal", desc: "Peça decorativa funcional, com estética mística. Produção manual e design autoral.", price: "40,00", image: "https://images.unsplash.com/photo-1602928321679-560bb453f190?auto=format&fit=crop&w=600&q=80" },
                { id: 2, name: "Caixinha de Joias", desc: "Estrutura firme e acabamento detalhado para guardar acessórios e pequenos objetos.", price: "60,00", image: "https://images.unsplash.com/photo-1582142306909-195724d339c4?auto=format&fit=crop&w=600&q=80" }
            ];

            const paintings = [
                { id: 1, name: "Ilustração Botânica Dark", desc: "Arte original em nanquim, explorando o misticismo e a natureza.", price: "120,00", image: "https://images.unsplash.com/photo-1513689125086-6c432170e843?auto=format&fit=crop&w=600&q=80" }
            ];

            const handleOrderSubmit = () => {
                if (!orderForm.name || !orderForm.idea) return alert("Preencha seu nome e a sua ideia mágica!");
                const msg = `Olá Tay! ✨\nSou *${orderForm.name}*.\nQuero encomendar: *${orderForm.type}*\n\nMinha ideia:\n"${orderForm.idea}"`;
                window.open(`https://wa.me/5551981749825?text=${encodeURIComponent(msg)}`);
            };

            const stars = useMemo(() => [...Array(25)].map((_, i) => ({
                id: i, top: `${Math.random() * 100}%`, left: `${Math.random() * 100}%`, size: Math.random() * 15 + 8, delay: `${Math.random() * 5}s`
            })), []);

            return (
                <div className="min-h-screen relative pb-24 md:pb-0 md:pt-24 selection:bg-ouro/30">
                    <div className="fixed inset-0 pointer-events-none z-[1] paper-texture opacity-10"></div>
                    <div className="fixed inset-0 pointer-events-none z-0">
                        {stars.map(s => (
                            <svg key={s.id} viewBox="0 0 24 24" fill="currentColor" 
                                 className="absolute text-ouroclaro/10 animate-pulse" 
                                 style={{ top: s.top, left: s.left, width: s.size, animationDelay: s.delay }}>
                                <path d="M12 17.27L18.18 21L16.54 13.97L22 9.24L14.81 8.63L12 2L9.19 8.63L2 9.24L7.46 13.97L5.82 21L12 17.27Z" />
                            </svg>
                        ))}
                    </div>

                    {/* NAVBAR PC */}
                    <nav className="hidden md:flex fixed top-0 w-full h-24 glass-nav z-50 border-b px-12 justify-between items-center shadow-lg">
                        <div className="flex items-center gap-4 cursor-pointer group" onClick={() => setSection('inicio')}>
                            <LogoOficina size={65} />
                            <div className="flex items-baseline gap-2">
                                <h1 className="text-3xl font-serif text-ouro drop-shadow-md">Oficina</h1>
                                <span className="font-hand text-2xl text-texto">da</span>
                                <h1 className="text-3xl font-serif text-ouro drop-shadow-md">Lua</h1>
                            </div>
                        </div>
                        <div className="flex gap-10 font-sans text-xs uppercase tracking-[0.2em] font-bold">
                            <button onClick={() => setSection('inicio')} className={section === 'inicio' ? 'text-ouro border-b-2 border-ouro' : 'text-slate-400 hover:text-ouro transition-colors pb-0.5 border-b-2 border-transparent'}>Artes</button>
                            <button onClick={() => setSection('pinturas')} className={section === 'pinturas' ? 'text-ouro border-b-2 border-ouro' : 'text-slate-400 hover:text-ouro transition-colors pb-0.5 border-b-2 border-transparent'}>Pinturas</button>
                            <button onClick={() => setSection('sobre')} className={section === 'sobre' ? 'text-ouro border-b-2 border-ouro' : 'text-slate-400 hover:text-ouro transition-colors pb-0.5 border-b-2 border-transparent'}>Sobre a Tay</button>
                        </div>
                    </nav>

                    {/* NAVBAR MOBILE */}
                    <nav className="md:hidden fixed bottom-0 w-full h-20 glass-nav z-50 border-t flex justify-around items-center px-2 shadow-[0_-10px_20px_rgba(0,0,0,0.3)]">
                        <button onClick={() => setSection('inicio')} className={`flex flex-col items-center gap-1 ${section === 'inicio' ? 'text-ouro' : 'text-slate-400'}`}>
                            <span className="text-[10px] font-bold uppercase tracking-widest">Artes</span>
                        </button>
                        <button onClick={() => setSection('pinturas')} className={`flex flex-col items-center gap-1 ${section === 'pinturas' ? 'text-ouro' : 'text-slate-400'}`}>
                            <span className="text-[10px] font-bold uppercase tracking-widest">Pinturas</span>
                        </button>
                        <button onClick={() => setSection('sobre')} className={`flex flex-col items-center gap-1 ${section === 'sobre' ? 'text-ouro' : 'text-slate-400'}`}>
                            <span className="text-[10px] font-bold uppercase tracking-widest">Sobre</span>
                        </button>
                    </nav>

                    <main className="relative z-10 max-w-5xl mx-auto px-6 py-12 pt-32 md:pt-12 fade-in">
                        
                        {/* SEÇÃO INÍCIO */}
                        {section === 'inicio' && (
                            <div className="space-y-24">
                                <header className="text-center space-y-8 pt-8">
                                    <div className="flex justify-center mb-10"><LogoOficina size={180} /></div>
                                    <h1 className="font-serif text-4xl md:text-7xl font-bold tracking-tighter block leading-none text-ouro">Arte Feita à Mão com Alma e Magia</h1>
                                    <h2 className="font-serif text-xl md:text-2xl text-slate-300 block">Bem-vindo(a) à Oficina da Lua!</h2>
                                    <p className="font-sans text-lg text-slate-400 max-w-3xl mx-auto leading-relaxed block font-light">Meu trabalho é um mergulho nos mundos do desenho, da pintura e da cerâmica, criando peças únicas que levam mais cor e afeto para o seu cotidiano.</p>
                                </header>

                                <div className="space-y-12">
                                    <div className="flex justify-between items-end border-b border-ouro/20 pb-4">
                                        <h3 className="font-serif text-3xl font-bold tracking-tighter text-ouro">Cerâmica e Biscuit</h3>
                                    </div>
                                    
                                    <div className="grid md:grid-cols-2 gap-10">
                                        {arts.map(art => (
                                            <div key={art.id} className="group bg-card border border-ouro/10 rounded-[2.5rem] overflow-hidden flex flex-col hover:border-ouro/50 transition-all shadow-xl">
                                                <div className="aspect-[4/5] bg-slate-800 relative">
                                                    <img src={art.image} className="w-full h-full object-cover opacity-90 group-hover:opacity-100 group-hover:scale-105 transition-all duration-700" />
                                                </div>
                                                <div className="p-8 space-y-4 flex-1 flex flex-col">
                                                    <div className="flex justify-between items-start mb-2">
                                                        <h4 className="font-serif text-2xl font-bold text-ouro leading-tight">{art.name}</h4>
                                                        <div className="text-right ml-4 font-sans">
                                                            <span className="text-[10px] text-slate-400 block uppercase tracking-widest font-bold">Valor</span>
                                                            <span className="text-lg font-bold text-texto">R$ {art.price}</span>
                                                        </div>
                                                    </div>
                                                    <p className="font-sans text-slate-300 font-light block text-sm flex-1 leading-relaxed">{art.desc}</p>
                                                    <button onClick={() => {
                                                        document.getElementById('form-encomenda').scrollIntoView({ behavior: 'smooth' });
                                                        setOrderForm({...orderForm, type: 'Cerâmica / Biscuit', idea: `Olá! Amei a peça: ${art.name}`});
                                                    }} className="w-full font-sans text-[10px] uppercase tracking-[0.3em] font-bold border border-ouro/30 py-4 rounded-xl text-ouro mt-4 hover:bg-ouro hover:text-fundo transition-all">Encomendar Magia</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* FORMULÁRIO DE ENCOMENDA */}
                                <div id="form-encomenda" className="bg-card p-8 md:p-16 rounded-[3rem] border border-ouro/20 shadow-2xl relative overflow-hidden">
                                    <div className="max-w-xl mx-auto space-y-8 relative z-10">
                                        <div className="text-center space-y-4 mb-10">
                                            <h3 className="font-serif text-4xl md:text-5xl font-bold tracking-tighter text-ouro">Faça sua Encomenda</h3>
                                            <p className="font-sans text-slate-300 font-light text-lg">De cerâmicas a ilustrações, vamos transformar a sua imaginação em arte.</p>
                                        </div>
                                        <div className="grid gap-5">
                                            <input type="text" placeholder="Qual o seu nome?" className="form-input font-sans text-sm" 
                                                   value={orderForm.name} onChange={e => setOrderForm({...orderForm, name: e.target.value})} />
                                            <select className="form-input font-sans text-slate-300 text-sm" 
                                                    value={orderForm.type} onChange={e => setOrderForm({...orderForm, type: e.target.value})}>
                                                <option>Cerâmica / Biscuit</option>
                                                <option>Pintura / Ilustração</option>
                                                <option>Caderno Artesanal Personalizado</option>
                                                <option>Orçamento para Tatuagem</option>
                                            </select>
                                            <textarea placeholder="Me conte sua ideia! (Cores, referências, sentimentos da peça...)" 
                                                      className="form-input font-sans text-sm h-32 resize-none"
                                                      value={orderForm.idea} onChange={e => setOrderForm({...orderForm, idea: e.target.value})}></textarea>
                                            <button onClick={handleOrderSubmit} className="w-full bg-ouro text-fundo py-5 rounded-xl font-sans font-bold text-xs uppercase tracking-widest hover:bg-ouroclaro transition-all shadow-lg shadow-ouro/20 mt-2">
                                                Enviar Encomenda (WhatsApp)
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* OUTRAS SEÇÕES (Simplificadas para o exemplo) */}
                        {section === 'pinturas' && (
                            <div className="text-center fade-in space-y-8">
                                <h2 className="font-serif text-5xl font-bold text-ouro">Galeria de Pinturas</h2>
                                <p className="text-slate-300 font-light">Explorando o lado sombrio e sensível da estética.</p>
                                {/* Aqui mapearia as pinturas da mesma forma que as artes */}
                            </div>
                        )}
                        
                        {section === 'sobre' && (
                            <div className="text-center fade-in space-y-8 max-w-2xl mx-auto">
                                <h2 className="font-serif text-5xl font-bold text-ouro">Seja bem-vindo ao meu mundo</h2>
                                <p className="text-slate-300 font-light text-lg">Oi, eu sou a Tay! Aqui, a arte é a linguagem que uso para explorar a natureza, o misticismo e a beleza dos corpos femininos. Tudo o que verá nasce de um lugar de afeto e de um olhar que encontra magia no sensível e no sombrio.</p>
                            </div>
                        )}

                    </main>

                    <footer className="py-20 text-center border-t border-ouro/10 mt-20 opacity-60 relative z-10">
                        <div className="flex justify-center mb-6"><LogoOficina size={70} /></div>
                        <div className="font-serif text-ouro text-lg tracking-widest flex items-center justify-center gap-2">Oficina <span className="font-hand lowercase">da</span> Lua</div>
                        <p className="font-sans text-[8px] uppercase tracking-[0.4em] mt-4 text-slate-500">Taylise Ink • 2026</p>
                        
                        {/* ACESSO AO ADMIN (Escondido no rodapé) */}
                        <button onClick={navigateToAdmin} className="mt-8 text-slate-600 hover:text-ouro transition-colors" title="Acesso Restrito">
                            <svg className="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                        </button>
                    </footer>
                </div>
            );
        };

        // ==========================================
        // ÁREA RESTRITA (ADMIN DASHBOARD)
        // ==========================================
        const AdminDashboard = ({ onLogout }) => {
            const [activeTab, setActiveTab] = useState('dashboard');

            // Mock de dados para o controle
            const orders = [
                { id: '101', client: 'Marina S.', item: 'Incensário', status: 'Produção', deadline: '25/03/2026' },
                { id: '102', client: 'João P.', item: 'Pintura A4', status: 'Novo', deadline: '02/04/2026' }
            ];

            const supplies = [
                { id: 1, name: 'Argila Escolar 1kg', qty: 2, status: 'ok' },
                { id: 2, name: 'Tinta Nanquim Preta', qty: 0, status: 'critico' },
                { id: 3, name: 'Papel Pólen 90g', qty: 15, status: 'atencao' }
            ];

            return (
                <div className="min-h-screen bg-adminbg text-texto font-sans flex flex-col md:flex-row">
                    {/* Sidebar Admin */}
                    <aside className="w-full md:w-64 bg-admincard border-r border-gray-800 flex flex-col">
                        <div className="p-6 border-b border-gray-800 flex items-center gap-3">
                            <LogoOficina size={40} />
                            <div>
                                <h2 className="font-serif text-ouro font-bold">Ateliê Admin</h2>
                                <span className="text-[10px] text-gray-500 uppercase tracking-widest">Painel de Controle</span>
                            </div>
                        </div>
                        <nav className="flex-1 p-4 space-y-2 text-sm">
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full text-left px-4 py-3 rounded-lg transition-colors ${activeTab === 'dashboard' ? 'bg-ouro/10 text-ouro' : 'text-gray-400 hover:bg-gray-800'}`}>📊 Visão Geral</button>
                            <button onClick={() => setActiveTab('encomendas')} className={`w-full text-left px-4 py-3 rounded-lg transition-colors ${activeTab === 'encomendas' ? 'bg-ouro/10 text-ouro' : 'text-gray-400 hover:bg-gray-800'}`}>📦 Encomendas</button>
                            <button onClick={() => setActiveTab('estoque')} className={`w-full text-left px-4 py-3 rounded-lg transition-colors ${activeTab === 'estoque' ? 'bg-ouro/10 text-ouro' : 'text-gray-400 hover:bg-gray-800'}`}>🖼️ Estoque & Obras</button>
                            <button onClick={() => setActiveTab('insumos')} className={`w-full text-left px-4 py-3 rounded-lg transition-colors ${activeTab === 'insumos' ? 'bg-ouro/10 text-ouro' : 'text-gray-400 hover:bg-gray-800'}`}>🎨 Insumos</button>
                        </nav>
                        <div className="p-4 border-t border-gray-800">
                            <button onClick={onLogout} className="w-full px-4 py-2 text-red-400 text-xs font-bold uppercase tracking-wider hover:bg-red-900/20 rounded-lg">Sair do Painel</button>
                        </div>
                    </aside>

                    {/* Main Content Admin */}
                    <main className="flex-1 p-6 md:p-10 overflow-y-auto">
                        
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6 fade-in">
                                <h2 className="text-2xl font-serif text-white">Resumo do Ateliê</h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-admincard p-6 rounded-xl border border-gray-800">
                                        <h3 className="text-gray-400 text-xs uppercase tracking-wider mb-2">Encomendas Ativas</h3>
                                        <p className="text-3xl font-bold text-ouro">4</p>
                                    </div>
                                    <div className="bg-admincard p-6 rounded-xl border border-gray-800">
                                        <h3 className="text-gray-400 text-xs uppercase tracking-wider mb-2">Faturamento (Mês)</h3>
                                        <p className="text-3xl font-bold text-green-400">R$ 850,00</p>
                                    </div>
                                    <div className="bg-admincard p-6 rounded-xl border border-red-900/30">
                                        <h3 className="text-gray-400 text-xs uppercase tracking-wider mb-2">Insumos em Falta</h3>
                                        <p className="text-3xl font-bold text-red-400">1</p>
                                        <p className="text-xs text-red-400/70 mt-1">Tinta Nanquim Preta</p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'encomendas' && (
                            <div className="space-y-6 fade-in">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-serif text-white">Gestão de Encomendas</h2>
                                    <button className="bg-ouro text-adminbg px-4 py-2 rounded text-xs font-bold">+ Nova Encomenda</button>
                                </div>
                                <div className="bg-admincard rounded-xl border border-gray-800 overflow-hidden">
                                    <table className="w-full text-left text-sm">
                                        <thead className="bg-gray-800/50 text-gray-400">
                                            <tr>
                                                <th className="p-4 font-normal">ID</th>
                                                <th className="p-4 font-normal">Cliente</th>
                                                <th className="p-4 font-normal">Peça</th>
                                                <th className="p-4 font-normal">Prazo</th>
                                                <th className="p-4 font-normal">Status</th>
                                                <th className="p-4 font-normal">Ações</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {orders.map(order => (
                                                <tr key={order.id} className="border-t border-gray-800 hover:bg-gray-800/20">
                                                    <td className="p-4 text-gray-500">#{order.id}</td>
                                                    <td className="p-4 font-medium">{order.client}</td>
                                                    <td className="p-4">{order.item}</td>
                                                    <td className="p-4 text-ouro">{order.deadline}</td>
                                                    <td className="p-4">
                                                        <span className={`px-2 py-1 rounded text-xs ${order.status === 'Novo' ? 'bg-blue-900/50 text-blue-400' : 'bg-yellow-900/50 text-yellow-400'}`}>
                                                            {order.status}
                                                        </span>
                                                    </td>
                                                    <td className="p-4 text-ouro cursor-pointer hover:underline">Editar</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'insumos' && (
                            <div className="space-y-6 fade-in">
                                <h2 className="text-2xl font-serif text-white">Controle de Insumos</h2>
                                <p className="text-gray-400 text-sm">Controle de materiais para você nunca ficar sem na hora de criar.</p>
                                <div className="grid gap-4">
                                    {supplies.map(sup => (
                                        <div key={sup.id} className="bg-admincard p-4 rounded-xl border border-gray-800 flex justify-between items-center">
                                            <div>
                                                <h4 className="font-medium">{sup.name}</h4>
                                                <p className="text-xs text-gray-500">Quantidade atual: {sup.qty}</p>
                                            </div>
                                            <div>
                                                {sup.status === 'ok' && <span className="text-xs bg-green-900/30 text-green-400 px-3 py-1 rounded-full">Ok</span>}
                                                {sup.status === 'atencao' && <span className="text-xs bg-yellow-900/30 text-yellow-400 px-3 py-1 rounded-full">Comprar em breve</span>}
                                                {sup.status === 'critico' && <span className="text-xs bg-red-900/30 text-red-400 px-3 py-1 rounded-full animate-pulse">Faltando!</span>}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'estoque' && (
                            <div className="space-y-6 fade-in text-center py-20">
                                <h2 className="text-2xl font-serif text-white mb-2">Estoque do Site</h2>
                                <p className="text-gray-400 text-sm">Aqui você adicionará e removerá obras do site principal.</p>
                                <p className="text-ouro text-xs mt-4">(Será conectado ao Firebase em breve)</p>
                            </div>
                        )}

                    </main>
                </div>
            )
        };

        // ==========================================
        // COMPONENTE PRINCIPAL (ROTEADOR)
        // ==========================================
        function App() {
            const [view, setView] = useState('public'); // 'public', 'login', 'admin'
            const [isAuthenticated, setIsAuthenticated] = useState(false);

            // Simulação de Login (Substituir por Firebase Auth depois)
            const handleLogin = (e) => {
                e.preventDefault();
                // Aqui entrará o: signInWithEmailAndPassword(auth, email, password)
                setIsAuthenticated(true);
                setView('admin');
            };

            const handleLogout = () => {
                // Aqui entrará o: signOut(auth)
                setIsAuthenticated(false);
                setView('public');
            };

            if (view === 'public') {
                return <PublicSite navigateToAdmin={() => setView('login')} />;
            }

            if (view === 'login') {
                return (
                    <div className="min-h-screen bg-adminbg flex flex-col justify-center items-center p-4">
                        <div className="bg-admincard p-8 rounded-2xl border border-gray-800 w-full max-w-md shadow-2xl fade-in">
                            <div className="flex justify-center mb-6"><LogoOficina size={80} /></div>
                            <h2 className="text-2xl font-serif text-ouro text-center mb-6">Acesso ao Ateliê</h2>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs text-gray-400 uppercase tracking-widest mb-1">E-mail Mágico</label>
                                    <input type="email" required className="admin-input" placeholder="tay@oficinadalua.com" />
                                </div>
                                <div>
                                    <label className="block text-xs text-gray-400 uppercase tracking-widest mb-1">Senha Secreta</label>
                                    <input type="password" required className="admin-input" placeholder="••••••••" />
                                </div>
                                <button type="submit" className="w-full bg-ouro text-adminbg font-bold py-3 rounded-lg hover:bg-ouroclaro transition-colors mt-4">
                                    Entrar no Painel
                                </button>
                            </form>
                            <button onClick={() => setView('public')} className="w-full text-center text-xs text-gray-500 hover:text-white mt-6">
                                Voltar para o site
                            </button>
                        </div>
                    </div>
                );
            }

            if (view === 'admin' && isAuthenticated) {
                return <AdminDashboard onLogout={handleLogout} />;
            }

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
