<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina da Lua | Taylise Ink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuração de Cores e Fontes -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fundo: '#202a36',
                        card: '#2b3847', 
                        ouro: '#dca868', 
                        ouroclaro: '#f4ce83',
                        texto: '#e2e8f0',
                        adminbg: '#111827',
                        admincard: '#1f2937'
                    },
                    fontFamily: {
                        serif: ['"Cinzel Decorative"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                        hand: ['"Dancing Script"', 'cursive']
                    }
                }
            }
        }
    </script>

    <!-- React e Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- FIREBASE MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDdiY8S8GN-OB7iFLZ34fVhbsGGOzICo3A",
            authDomain: "oficinadalua-574a7.firebaseapp.com",
            projectId: "oficinadalua-574a7",
            storageBucket: "oficinadalua-574a7.firebasestorage.app",
            messagingSenderId: "1073145705062",
            appId: "1:1073145705062:web:f1ad5a9d407a873e1273a7",
            measurementId: "G-8V4312YZR1"
        };
        
        const app = initializeApp(firebaseConfig);
        
        window.fbAuth = getAuth(app);
        window.fbDb = getFirestore(app);
        window.fbMethods = {
            signInWithEmailAndPassword, signOut, onAuthStateChanged, signInAnonymously,
            collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc
        };

        window.dispatchEvent(new Event('firebase-ready'));
    </script> 

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Dancing+Script:wght@400;700&family=Inter:wght@300;400;600&display=swap');
        
        body { background-color: #202a36; color: #e2e8f0; margin: 0; overflow-x: hidden; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }

        .glass-nav {
            background: rgba(32, 42, 54, 0.9);
            backdrop-filter: blur(15px);
            border-color: rgba(220, 168, 104, 0.2);
        }

        .paper-texture {
            background-image: url('https://www.transparenttextures.com/patterns/handmade-paper.png');
            mix-blend-mode: overlay;
        }

        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-input {
            background: #2b3847; border: 1px solid rgba(220, 168, 104, 0.3);
            color: white; padding: 12px; border-radius: 12px; width: 100%; outline: none; transition: border 0.3s;
        }
        .form-input:focus { border-color: #dca868; }

        .admin-input {
            background: #374151; border: 1px solid #4b5563;
            color: white; padding: 8px 12px; border-radius: 6px; width: 100%; outline: none; font-size: 0.875rem;
        }
        .admin-input:focus { border-color: #dca868; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-fundo text-texto font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const appId = "oficinalua"; 

        // --- FUNÇÃO AUXILIAR: CONVERSOR GOOGLE DRIVE ---
        const parseDriveUrl = (url) => {
            if (!url) return '';
            const driveRegex = /\/file\/d\/([a-zA-Z0-9_-]+)/;
            const match = url.match(driveRegex);
            if (match && match[1]) return `https://lh3.googleusercontent.com/d/${match[1]}`;
            
            const idRegex = /[?&]id=([a-zA-Z0-9_-]+)/;
            const matchId = url.match(idRegex);
            if (matchId && matchId[1]) return `https://lh3.googleusercontent.com/d/${matchId[1]}`;
            
            return url;
        };

        // --- COMPONENTE LOGO ---
        const LogoOficina = ({ size = 80 }) => {
            const driveImageUrl = "https://lh3.googleusercontent.com/d/1Hxt6UiA_FTS_iFwxhOTRM5HO3CXc27qs";
            return (
                <div className="relative animate-float flex items-center justify-center" style={{ width: size, height: size }}>
                    <img 
                        src={driveImageUrl} 
                        alt="Logo Oficina da Lua" 
                        className="w-full h-full object-contain drop-shadow-[0_0_15px_rgba(220,168,104,0.4)]"
                        onError={(e) => {
                            if (!e.target.dataset.retried) {
                                e.target.dataset.retried = "true";
                                e.target.src = "https://drive.google.com/thumbnail?id=1Hxt6UiA_FTS_iFwxhOTRM5HO3CXc27qs&sz=w800";
                            }
                        }}
                    />
                </div>
            );
        };

        // ==========================================
        // ÁREA PÚBLICA (CLIENTE)
        // ==========================================
        const PublicSite = ({ navigateToAdmin, user }) => {
            const [section, setSection] = useState('inicio');
            const [orderForm, setOrderForm] = useState({ name: '', type: 'Arte Personalizada', idea: '' });
            const [isSubmitting, setIsSubmitting] = useState(false);
            
            const [artworks, setArtworks] = useState([]);
            const [patterns, setPatterns] = useState([]); 

            useEffect(() => {
                if (!window.fbMethods) return;
                const { collection, onSnapshot } = window.fbMethods;
                
                const unsubArtworks = onSnapshot(collection(window.fbDb, 'artifacts', appId, 'public', 'data', 'artworks'), 
                    (snapshot) => setArtworks(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })))
                );
                
                const unsubPatterns = onSnapshot(collection(window.fbDb, 'artifacts', appId, 'public', 'data', 'patterns'), 
                    (snapshot) => setPatterns(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })))
                );

                return () => { unsubArtworks(); unsubPatterns(); };
            }, [user]);

            const arts = artworks.filter(a => a.category === 'Cerâmica / Biscuit');
            const pinturasAcrilica = artworks.filter(a => a.category === 'Pintura - Acrílica' || a.category === 'Pintura / Ilustração');
            const pinturasAquarela = artworks.filter(a => a.category === 'Pintura - Aquarela');
            const processos = artworks.filter(a => a.category === 'Processo Criativo');
            const suspiros = artworks.filter(a => a.category === 'Arte de Suspiro');

            const handleOrderSubmit = async () => {
                if (!orderForm.name || !orderForm.idea) return alert("Preencha o seu nome e a sua ideia mágica!");
                if (!user) return alert("A ligar à base de dados... Tente novamente.");
                
                setIsSubmitting(true);
                try {
                    const { addDoc, collection } = window.fbMethods;
                    await addDoc(collection(window.fbDb, 'artifacts', appId, 'public', 'data', 'orders'), {
                        client: orderForm.name,
                        item: orderForm.type,
                        idea: orderForm.idea,
                        status: 'Novo',
                        deadline: '',
                        price: 0,
                        cost: 0,
                        createdAt: new Date().toISOString()
                    });

                    const msg = `Olá Tay! ✨\nSou *${orderForm.name}*.\nQuero encomendar: *${orderForm.type}*\n\nMinha ideia:\n"${orderForm.idea}"`;
                    window.open(`https://wa.me/5551981749825?text=${encodeURIComponent(msg)}`);
                    
                    setOrderForm({ name: '', type: 'Arte Personalizada', idea: '' });
                    alert("A sua encomenda foi enviada para o ateliê!");
                } catch (error) {
                    console.error("Erro", error);
                    alert("Ocorreu um erro ao enviar.");
                } finally {
                    setIsSubmitting(false);
                }
            };

            const handleOrderClick = (type, customIdea) => {
                setSection('inicio');
                setTimeout(() => {
                    const el = document.getElementById('form-encomenda');
                    if(el) el.scrollIntoView({ behavior: 'smooth' });
                }, 100);
                setOrderForm({...orderForm, type: type, idea: customIdea});
            };

            // COMPONENTE: Card de Obra com Carrossel de Imagens Aprimorado
            const ArtworkCard = ({ art }) => {
                const [activeImg, setActiveImg] = useState(0);
                const images = art.images && art.images.length > 0 ? art.images.filter(i => i) : (art.image ? [art.image] : []);

                const nextImg = (e) => {
                    e.stopPropagation();
                    setActiveImg((prev) => (prev === images.length - 1 ? 0 : prev + 1));
                };

                const prevImg = (e) => {
                    e.stopPropagation();
                    setActiveImg((prev) => (prev === 0 ? images.length - 1 : prev - 1));
                };

                const hasRealTitle = art.name && art.name !== 'Sem Título';

                return (
                    <div className="group bg-card border border-ouro/10 rounded-[2.5rem] overflow-hidden flex flex-col hover:border-ouro/50 transition-all shadow-xl">
                        <div className="aspect-[4/5] bg-slate-800 relative">
                            {images.length > 0 ? (
                                <img src={images[activeImg]} className="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-all duration-700" />
                            ) : (
                                <div className="w-full h-full flex items-center justify-center text-gray-500 text-xs italic font-sans">Sem Imagem</div>
                            )}
                            
                            {/* SETAS DE NAVEGAÇÃO PARA CARROSSEL */}
                            {images.length > 1 && (
                                <>
                                    <button onClick={prevImg} className="absolute left-2 top-1/2 -translate-y-1/2 w-10 h-10 flex items-center justify-center bg-black/40 hover:bg-black/70 text-white rounded-full z-20 backdrop-blur-sm transition-all" aria-label="Foto anterior">
                                        <svg className="w-5 h-5 pr-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M15 19l-7-7 7-7" /></svg>
                                    </button>
                                    <button onClick={nextImg} className="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 flex items-center justify-center bg-black/40 hover:bg-black/70 text-white rounded-full z-20 backdrop-blur-sm transition-all" aria-label="Próxima foto">
                                        <svg className="w-5 h-5 pl-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 5l7 7-7 7" /></svg>
                                    </button>
                                </>
                            )}
                            
                            {/* NAVEGAÇÃO DE BOLINHAS (VISUAL APENAS) */}
                            {images.length > 1 && (
                                <div className="absolute bottom-4 left-0 right-0 flex justify-center gap-2 z-10 pointer-events-none">
                                    {images.map((_, idx) => (
                                        <div key={idx} className={`w-2 h-2 rounded-full transition-all ${activeImg === idx ? 'bg-ouro scale-125 shadow-[0_0_5px_#dca868]' : 'bg-white/50'}`}>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                        <div className="p-8 space-y-4 flex-1 flex flex-col">
                            <div className="flex justify-between items-start mb-2">
                                <h4 className="font-serif text-2xl font-bold text-ouro leading-tight">
                                    {hasRealTitle ? art.name : <span className="text-slate-500 italic text-sm">(Obra sem título)</span>}
                                </h4>
                                <div className="text-right ml-4 font-sans shrink-0">
                                    <span className="text-[10px] text-slate-400 block uppercase tracking-widest font-bold">Valor</span>
                                    <span className="text-lg font-bold text-texto">
                                        {art.price === '0,00' ? 'Sob Cons.' : `R$ ${art.price}`}
                                    </span>
                                </div>
                            </div>
                            <p className="font-sans text-slate-300 font-light block text-sm flex-1 leading-relaxed whitespace-pre-line">{art.desc}</p>
                            <button onClick={() => handleOrderClick(art.category, `Olá! Amei a peça: ${hasRealTitle ? art.name : 'do catálogo'}`)} className="w-full font-sans text-[10px] uppercase tracking-[0.3em] font-bold border border-ouro/30 py-4 rounded-xl text-ouro mt-4 hover:bg-ouro hover:text-fundo transition-all">Encomendar Similar</button>
                        </div>
                    </div>
                );
            };

            // COMPONENTE: Card Simples para Processos e Suspiros (Sem botão de compra)
            const SimpleImageCard = ({ src, art }) => {
                const displayImage = src || (art && art.images && art.images.length > 0 ? art.images[0] : art?.image);
                const hasRealTitle = art && art.name && art.name !== 'Sem Título';
                
                return (
                    <div className="bg-card border border-ouro/10 rounded-2xl overflow-hidden shadow-lg group relative aspect-[4/5]">
                        <img src={displayImage} className="w-full h-full object-cover opacity-90 group-hover:opacity-100 group-hover:scale-105 transition-all duration-700" />
                        {hasRealTitle && (
                            <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/90 to-transparent p-4 pt-12 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                                <h4 className="text-ouro font-serif font-bold text-sm leading-tight">{art.name}</h4>
                                {art.desc && <p className="text-gray-300 text-[10px] line-clamp-2 mt-1">{art.desc}</p>}
                            </div>
                        )}
                    </div>
                )
            };

            // FALLBACKS (Apenas mostrados se o Admin ainda não importou para o Banco de Dados)
            const hardcodedAcrilica = [
                "https://drive.google.com/file/d/1OAlb6R0-pLicXjQTIf4Rv_NABmwBCkUk/view?usp=sharing",
                "https://drive.google.com/file/d/1WjpHXdXJkn9yFEYjffN8tDa17V4aNE-t/view?usp=sharing",
                "https://drive.google.com/file/d/1hn116HG10Dg2yX_1MSAqoGVDFr-V0pqa/view?usp=sharing",
                "https://drive.google.com/file/d/1DQZfy7PEriSr5Dk4Gyt0472QnE4xWzQ6/view?usp=sharing",
                "https://drive.google.com/file/d/12CYuHJvFvch6nryiTVjKSjtuDt3J5bjZ/view?usp=sharing"
            ].map(parseDriveUrl);

            const hardcodedAquarela = [
                "https://drive.google.com/file/d/1LkZdrijINYvANMLPoraY-7Zm-H74PTxc/view?usp=sharing",
                "https://drive.google.com/file/d/1XjlV7QqPcrNPouvBBrwOGjCMESyws8Sp/view?usp=sharing"
            ].map(parseDriveUrl);

            const hardcodedProcesso = [
                "https://drive.google.com/file/d/1NDKT5TI-17Xl2Fqw3GlTEfqNeHwGs5Da/view?usp=sharing",
                "https://drive.google.com/file/d/1BLMKlAkiuH3HS3PyePctu5Npfq8xMXU2/view?usp=sharing"
            ].map(parseDriveUrl);

            const hardcodedSuspiro = [
                "https://drive.google.com/file/d/1-RLQpG7cXrW8-pL8mv5uomWfHqHMb19P/view?usp=sharing",
                "https://drive.google.com/file/d/1xeMV1yO9vsRU-jkftVmTKiAGnbTU0ZSo/view?usp=sharing",
                "https://drive.google.com/file/d/1CB12s-tWguiTrmbhUfCk5KVkGwioDgQy/view?usp=sharing",
                "https://drive.google.com/file/d/1P8ER9sIM-1-50EBcO9DBg6KXDNJWhwTr/view?usp=sharing",
                "https://drive.google.com/file/d/1DraOdzby9SnVU5R3KkQs2BhrVPtyma1o/view?usp=sharing"
            ].map(parseDriveUrl);

            const stars = useMemo(() => [...Array(25)].map((_, i) => ({
                id: i, top: `${Math.random() * 100}%`, left: `${Math.random() * 100}%`, size: Math.random() * 15 + 8, delay: `${Math.random() * 5}s`
            })), []);

            return (
                <div className="min-h-screen relative pb-24 md:pb-0 md:pt-24 selection:bg-ouro/30">
                    <div className="fixed inset-0 pointer-events-none z-[1] paper-texture opacity-10"></div>
                    <div className="fixed inset-0 pointer-events-none z-0">
                        {stars.map(s => (
                            <svg key={s.id} viewBox="0 0 24 24" fill="currentColor" className="absolute text-ouroclaro/10 animate-pulse" style={{ top: s.top, left: s.left, width: s.size, animationDelay: s.delay }}>
                                <path d="M12 17.27L18.18 21L16.54 13.97L22 9.24L14.81 8.63L12 2L9.19 8.63L2 9.24L7.46 13.97L5.82 21L12 17.27Z" />
                            </svg>
                        ))}
                    </div>

                    <nav className="hidden md:flex fixed top-0 w-full h-24 glass-nav z-50 border-b px-12 justify-between items-center shadow-lg">
                        <div className="flex items-center gap-4 cursor-pointer group" onClick={() => setSection('inicio')}>
                            <LogoOficina size={65} />
                            <div className="flex items-baseline gap-2">
                                <h1 className="text-3xl font-serif text-ouro drop-shadow-md">Oficina</h1>
                                <span className="font-hand text-2xl text-texto">da</span>
                                <h1 className="text-3xl font-serif text-ouro drop-shadow-md">Lua</h1>
                            </div>
                        </div>
                        <div className="flex gap-10 font-sans text-xs uppercase tracking-[0.2em] font-bold">
                            <button onClick={() => setSection('inicio')} className={section === 'inicio' ? 'text-ouro border-b-2 border-ouro' : 'text-slate-400 hover:text-ouro transition-colors pb-0.5 border-b-2 border-transparent'}>Artes</button>
                            <button onClick={() => setSection('pinturas')} className={section === 'pinturas' ? 'text-ouro border-b-2 border-ouro' : 'text-slate-400 hover:text-ouro transition-colors pb-0.5 border-b-2 border-transparent'}>Pinturas</button>
                            <button onClick={() => setSection('cadernos')} className={section === 'cadernos' ? 'text-ouro border-b-2 border-ouro' : 'text-slate-400 hover:text-ouro transition-colors pb-0.5 border-b-2 border-transparent'}>Cadernos</button>
                            <button onClick={() => setSection('sobre')} className={section === 'sobre' ? 'text-ouro border-b-2 border-ouro' : 'text-slate-400 hover:text-ouro transition-colors pb-0.5 border-b-2 border-transparent'}>Sobre a Tay</button>
                        </div>
                    </nav>

                    <nav className="md:hidden fixed bottom-0 w-full h-20 glass-nav z-50 border-t flex justify-around items-center px-2 shadow-[0_-10px_20px_rgba(0,0,0,0.3)]">
                        <button onClick={() => setSection('inicio')} className={`flex flex-col items-center gap-1 ${section === 'inicio' ? 'text-ouro' : 'text-slate-400'}`}>
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                            <span className="text-[10px] font-bold uppercase tracking-widest">Artes</span>
                        </button>
                        <button onClick={() => setSection('pinturas')} className={`flex flex-col items-center gap-1 ${section === 'pinturas' ? 'text-ouro' : 'text-slate-400'}`}>
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" /></svg>
                            <span className="text-[10px] font-bold uppercase tracking-widest">Pinturas</span>
                        </button>
                        <button onClick={() => setSection('cadernos')} className={`flex flex-col items-center gap-1 ${section === 'cadernos' ? 'text-ouro' : 'text-slate-400'}`}>
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                            <span className="text-[10px] font-bold uppercase tracking-widest">Cadernos</span>
                        </button>
                        <button onClick={() => setSection('sobre')} className={`flex flex-col items-center gap-1 ${section === 'sobre' ? 'text-ouro' : 'text-slate-400'}`}>
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                            <span className="text-[10px] font-bold uppercase tracking-widest">Sobre</span>
                        </button>
                    </nav>

                    <main className="relative z-10 max-w-5xl mx-auto px-6 py-12 pt-8 md:pt-12 fade-in">
                        {section === 'inicio' && (
                            <div className="space-y-16 md:space-y-24">
                                <header className="text-center space-y-4 md:space-y-8 pt-4 md:pt-8">
                                    <div className="flex justify-center mb-6 md:mb-10"><LogoOficina size={180} /></div>
                                    <h1 className="font-serif text-4xl md:text-7xl font-bold tracking-tighter block leading-none text-ouro">Arte Feita à Mão com Alma e Magia</h1>
                                    <h2 className="font-serif text-xl md:text-2xl text-slate-300 block">Bem-vindo(a) à Oficina da Lua!</h2>
                                    <p className="font-sans text-lg text-slate-400 max-w-3xl mx-auto leading-relaxed block font-light">O meu trabalho é um mergulho nos mundos do desenho, da pintura e da cerâmica, criando peças únicas que levam mais cor e afeto para o seu quotidiano.</p>
                                </header>

                                <div className="space-y-12">
                                    <div className="flex justify-between items-end border-b border-ouro/20 pb-4">
                                        <h3 className="font-serif text-3xl font-bold tracking-tighter text-ouro">Cerâmica e Biscuit</h3>
                                    </div>
                                    {arts.length === 0 ? (
                                        <p className="text-slate-500 italic">Nenhuma peça de cerâmica no catálogo no momento.</p>
                                    ) : (
                                        <div className="grid md:grid-cols-2 gap-10">
                                            {arts.map(art => <ArtworkCard key={art.id} art={art} />)}
                                        </div>

                    const initialArts = [
                        { category: 'Arte de Suspiro', image: 'https://drive.google.com/file/d/1-RLQpG7cXrW8-pL8mv5uomWfHqHMb19P/view?usp=sharing' },
                        { category: 'Arte de Suspiro', image: 'https://drive.google.com/file/d/1xeMV1yO9vsRU-jkftVmTKiAGnbTU0ZSo/view?usp=sharing' },
                        { category: 'Arte de Suspiro', image: 'https://drive.google.com/file/d/1CB12s-tWguiTrmbhUfCk5KVkGwioDgQy/view?usp=sharing' },
                        { category: 'Arte de Suspiro', image: 'https://drive.google.com/file/d/1P8ER9sIM-1-50EBcO9DBg6KXDNJWhwTr/view?usp=sharing' },
                        { category: 'Arte de Suspiro', image: 'https://drive.google.com/file/d/1DraOdzby9SnVU5R3KkQs2BhrVPtyma1o/view?usp=sharing' },
                        { category: 'Pintura - Acrílica', image: 'https://drive.google.com/file/d/1OAlb6R0-pLicXjQTIf4Rv_NABmwBCkUk/view?usp=sharing' },
                        { category: 'Pintura - Acrílica', image: 'https://drive.google.com/file/d/1WjpHXdXJkn9yFEYjffN8tDa17V4aNE-t/view?usp=sharing' },
                        { category: 'Pintura - Acrílica', image: 'https://drive.google.com/file/d/1hn116HG10Dg2yX_1MSAqoGVDFr-V0pqa/view?usp=sharing' },
                        { category: 'Pintura - Acrílica', image: 'https://drive.google.com/file/d/1DQZfy7PEriSr5Dk4Gyt0472QnE4xWzQ6/view?usp=sharing' },
                        { category: 'Pintura - Acrílica', image: 'https://drive.google.com/file/d/12CYuHJvFvch6nryiTVjKSjtuDt3J5bjZ/view?usp=sharing' },
                        { category: 'Pintura - Aquarela', image: 'https://drive.google.com/file/d/1LkZdrijINYvANMLPoraY-7Zm-H74PTxc/view?usp=sharing' },
                        { category: 'Pintura - Aquarela', image: 'https://drive.google.com/file/d/1XjlV7QqPcrNPouvBBrwOGjCMESyws8Sp/view?usp=sharing' },
                        { category: 'Processo Criativo', image: 'https://drive.google.com/file/d/1NDKT5TI-17Xl2Fqw3GlTEfqNeHwGs5Da/view?usp=sharing' },
                        { category: 'Processo Criativo', image: 'https://drive.google.com/file/d/1BLMKlAkiuH3HS3PyePctu5Npfq8xMXU2/view?usp=sharing' }
                    ];
                    const { addDoc, collection } = window.fbMethods;
                    
                    for (const art of initialArts) {
                        const parsedUrl = parseDriveUrl(art.image);
                        await addDoc(collection(window.fbDb, 'artifacts', appId, 'public', 'data', 'artworks'), {
                            name: 'Sem Título',
                            desc: '',
                            price: '0,00',
                            category: art.category,
                            image: parsedUrl,
                            images: [parsedUrl, '', '', ''],
                            createdAt: new Date().toISOString()
                        });
                    }
                    alert('Galeria importada com sucesso! Agora as pinturas estão no banco de dados. Pode usar o botão "Editar" para adicionar os títulos.');
                } catch(e) {
                    console.error(e);
                    alert("Ocorreu um erro ao importar as imagens iniciais.");
                }
                setIsImporting(false);
            };

            // --- FUNÇÕES DE ESTAMPAS (PATTERNS) ---
            const handleAddPattern = async (e) => {
                e.preventDefault();
                const { addDoc, updateDoc, doc, collection } = window.fbMethods;
                const processedImage = parseDriveUrl(patForm.image);

                if (editingPatId) {
                    await updateDoc(doc(window.fbDb, 'artifacts', appId, 'public', 'data', 'patterns', editingPatId), {
                        ...patForm, image: processedImage
                    });
                    setEditingPatId(null);
                    alert("Estampa atualizada com sucesso!");
                } else {
                    await addDoc(collection(window.fbDb, 'artifacts', appId, 'public', 'data', 'patterns'), {
                        ...patForm, image: processedImage, createdAt: new Date().toISOString()
                    });
                    alert("Nova estampa adicionada ao catálogo!");
                }
                setPatForm({ name: '', desc: '', image: '' });
            };

            const handleEditPattern = (pat) => {
                setPatForm({ name: pat.name, desc: pat.desc, image: pat.image });
                setEditingPatId(pat.id);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const cancelEditPattern = () => {
                setPatForm({ name: '', desc: '', image: '' });
                setEditingPatId(null);
            };

            const handleDeletePattern = async (id) => {
                if(!confirm("Remover estampa permanentemente do site?")) return;
                const { deleteDoc, doc } = window.fbMethods;
                await deleteDoc(doc(window.fbDb, 'artifacts', appId, 'public', 'data', 'patterns', id));
            };

            // --- FUNÇÕES DE ESTOQUE/OBRAS ---
            const handleAddArtwork = async (e) => {
                e.preventDefault();
                const { addDoc, updateDoc, doc, collection } = window.fbMethods;
                
                const processedImages = (artForm.images || []).map(parseDriveUrl).filter(url => url.trim() !== '');
                const mainImage = processedImages.length > 0 ? processedImages[0] : ''; 

                const finalData = { ...artForm, images: processedImages, image: mainImage };

                if (editingArtworkId) {
                    await updateDoc(doc(window.fbDb, 'artifacts', appId, 'public', 'data', 'artworks', editingArtworkId), finalData);
                    setEditingArtworkId(null);
                    alert("Obra atualizada com sucesso!");
                } else {
                    await addDoc(collection(window.fbDb, 'artifacts', appId, 'public', 'data', 'artworks'), {
                        ...finalData, createdAt: new Date().toISOString()
                    });
                    alert("Obra adicionada à galeria!");
                }
                setArtForm({ name: '', desc: '', price: '', images: ['', '', '', ''], category: 'Cerâmica / Biscuit' });
            };

            const handleEditArtwork = (art) => {
                const currentImages = art.images && art.images.length > 0 ? art.images : (art.image ? [art.image] : []);
                const filledImages = [...currentImages];
                while(filledImages.length < 4) filledImages.push('');

                setArtForm({ name: art.name, desc: art.desc, price: art.price, images: filledImages, category: art.category });
                setEditingArtworkId(art.id);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const cancelEditArtwork = () => {
                setArtForm({ name: '', desc: '', price: '', images: ['', '', '', ''], category: 'Cerâmica / Biscuit' });
                setEditingArtworkId(null);
            };

            const handleDeleteArtwork = async (id) => {
                if(!confirm("Remover obra permanentemente do site público?")) return;
                const { deleteDoc, doc } = window.fbMethods;
                await deleteDoc(doc(window.fbDb, 'artifacts', appId, 'public', 'data', 'artworks', id));
            };

            // (OUTRAS FUNÇÕES MANTIDAS: Insumos, Encomendas, Coleções)
            const getSupplyStatus = (qty, threshold) => { if (qty <= 0) return 'critico'; if (qty <= threshold) return 'atencao'; return 'ok'; };
            const handleAddSupply = async (e) => { e.preventDefault(); if (!newSupName) return; const qty = Number(newSupQty) || 0; const threshold = Number(newSupThreshold) || 0; await window.fbMethods.addDoc(window.fbMethods.collection(window.fbDb, 'artifacts', appId, 'public', 'data', 'supplies'), { name: newSupName, qty: qty, unit: newSupUnit, threshold: threshold, status: getSupplyStatus(qty, threshold) }); setNewSupName(''); setNewSupQty(''); setNewSupThreshold(''); };
            const handleSaveSupplyQty = async (id, threshold) => { const newQty = Number(editingSupQty) || 0; await window.fbMethods.updateDoc(window.fbMethods.doc(window.fbDb, 'artifacts', appId, 'public', 'data', 'supplies', id), { qty: newQty, status: getSupplyStatus(newQty, threshold) }); setEditingSupId(null); };
            const handleDeleteSupply = async (id) => { if(!confirm("Deletar insumo permanentemente?")) return; await window.fbMethods.deleteDoc(window.fbMethods.doc(window.fbDb, 'artifacts', appId, 'public', 'data', 'supplies', id)); };
            const openOrderModal = (order = null) => { if (order) { setEditingOrder(order.id); setOrderForm({ ...order, price: order.price || '', cost: order.cost || '' }); } else { setEditingOrder(null); setOrderForm({ client: '', item: '', idea: '', status: 'Novo', deadline: '', price: '', cost: '' }); } setIsOrderModalOpen(true); };
            const handleSaveOrder = async (e) => { e.preventDefault(); const finalOrderData = { ...orderForm, price: Number(orderForm.price) || 0, cost: Number(orderForm.cost) || 0 }; if (editingOrder) { await window.fbMethods.updateDoc(window.fbMethods.doc(window.fbDb, 'artifacts', appId, 'public', 'data', 'orders', editingOrder), finalOrderData); } else { await window.fbMethods.addDoc(window.fbMethods.collection(window.fbDb, 'artifacts', appId, 'public', 'data', 'orders'), { ...finalOrderData, createdAt: new Date().toISOString() }); } setIsOrderModalOpen(false); };
            const handleAdvanceOrder = async (id, currentStatus) => { const nextStatus = currentStatus === 'Novo' ? 'Produção' : currentStatus === 'Produção' ? 'Pronto' : 'Entregue'; if (currentStatus === 'Entregue') return; await window.fbMethods.updateDoc(window.fbMethods.doc(window.fbDb, 'artifacts', appId, 'public', 'data', 'orders', id), { status: nextStatus }); };
            const handleDeleteOrder = async (id) => { if(!confirm("Excluir esta encomenda permanentemente?")) return; await window.fbMethods.deleteDoc(window.fbMethods.doc(window.fbDb, 'artifacts', appId, 'public', 'data', 'orders', id)); };
            const openColModal = (col = null) => { if (col) { setEditingColId(col.id); setColForm({ ...col }); } else { setEditingColId(null); setColForm({ name: '', theme: '', status: 'Ideação', targetDate: '', pieces: [], tasks: defaultTasks }); } setNewPieceName(''); setNewTaskName(''); setIsColModalOpen(true); };
            const handleAddPiece = () => { if (!newPieceName) return; setColForm({ ...colForm, pieces: [...colForm.pieces, { id: Date.now(), name: newPieceName, done: false }] }); setNewPieceName(''); };
            const handleAddTask = () => { if (!newTaskName) return; setColForm({ ...colForm, tasks: [...colForm.tasks, { id: Date.now(), title: newTaskName, done: false }] }); setNewTaskName(''); };
            const togglePiece = (pId) => { setColForm({...colForm, pieces: colForm.pieces.map(p => p.id === pId ? {...p, done: !p.done} : p)}); };
            const toggleTask = (tId) => { setColForm({...colForm, tasks: colForm.tasks.map(t => t.id === tId ? {...t, done: !t.done} : t)}); };
            const deletePiece = (pId) => { setColForm({...colForm, pieces: colForm.pieces.filter(p => p.id !== pId)}); };
            const deleteTask = (tId) => { setColForm({...colForm, tasks: colForm.tasks.filter(t => t.id !== tId)}); };
            const handleSaveCollection = async (e) => { e.preventDefault(); if (editingColId) { await window.fbMethods.updateDoc(window.fbMethods.doc(window.fbDb, 'artifacts', appId, 'public', 'data', 'collections', editingColId), colForm); } else { await window.fbMethods.addDoc(window.fbMethods.collection(window.fbDb, 'artifacts', appId, 'public', 'data', 'collections'), { ...colForm, createdAt: new Date().toISOString() }); } setIsColModalOpen(false); };
            const handleDeleteCollection = async (id) => { if(!confirm("Excluir esta coleção inteira permanentemente?")) return; await window.fbMethods.deleteDoc(window.fbMethods.doc(window.fbDb, 'artifacts', appId, 'public', 'data', 'collections', id)); };

            return (
                <div className="min-h-screen bg-adminbg text-texto font-sans flex flex-col md:flex-row relative">
                    
                    {/* MODAL DE ENCOMENDAS (Mantido igual) */}
                    {isOrderModalOpen && (
                        <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex justify-center items-center p-4">
                            <div className="bg-admincard p-6 rounded-2xl w-full max-w-2xl border border-ouro/30 shadow-2xl overflow-y-auto max-h-[90vh]">
                                <h3 className="text-2xl font-serif text-ouro mb-4">{editingOrder ? 'Editar Encomenda' : 'Nova Encomenda'}</h3>
                                <form onSubmit={handleSaveOrder} className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs text-gray-400 uppercase mb-1">Cliente</label>
                                            <input type="text" className="admin-input" required value={orderForm.client} onChange={e => setOrderForm({...orderForm, client: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-400 uppercase mb-1">Prazo / Data (Opcional)</label>
                                            <input type="date" className="admin-input" value={orderForm.deadline} onChange={e => setOrderForm({...orderForm, deadline: e.target.value})} />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs text-gray-400 uppercase mb-1">Peça / Serviço</label>
                                        <input type="text" className="admin-input" required value={orderForm.item} onChange={e => setOrderForm({...orderForm, item: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-gray-400 uppercase mb-1">Ideia / Detalhes</label>
                                        <textarea className="admin-input h-20" required value={orderForm.idea} onChange={e => setOrderForm({...orderForm, idea: e.target.value})}></textarea>
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-4 border-t border-gray-700 pt-4 mt-2">
                                        <div>
                                            <label className="block text-xs text-ouro uppercase mb-1">Valor Cobrado (R$)</label>
                                            <input type="number" step="0.01" className="admin-input" value={orderForm.price} onChange={e => setOrderForm({...orderForm, price: e.target.value})} placeholder="Ex: 150.00" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-red-400 uppercase mb-1">Custo Material (R$)</label>
                                            <input type="number" step="0.01" className="admin-input" value={orderForm.cost} onChange={e => setOrderForm({...orderForm, cost: e.target.value})} placeholder="Ex: 30.00" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs text-gray-400 uppercase mb-1 mt-2">Status Atual</label>
                                        <select className="admin-input" value={orderForm.status} onChange={e => setOrderForm({...orderForm, status: e.target.value})}>
                                            <option>Novo</option>
                                            <option>Produção</option>
                                            <option>Pronto</option>
                                            <option>Entregue</option>
                                        </select>
                                    </div>
                                    <div className="flex justify-end gap-2 mt-6">
                                        <button type="button" onClick={() => setIsOrderModalOpen(false)} className="px-4 py-2 text-gray-400 hover:text-white text-sm">Cancelar</button>
                                        <button type="submit" className="px-6 py-2 bg-ouro text-adminbg font-bold rounded-lg text-sm">Salvar no Banco</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL DE COLEÇÕES (Mantido igual) */}
                    {isColModalOpen && (
                        <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex justify-center items-center p-4">
                            <div className="bg-admincard p-6 rounded-2xl w-full max-w-4xl border border-ouro/30 shadow-2xl overflow-y-auto max-h-[95vh] flex flex-col">
                                <div className="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
                                    <h3 className="text-2xl font-serif text-ouro">{editingColId ? 'Gerenciar Coleção' : 'Criar Nova Coleção'}</h3>
                                    <button onClick={() => setIsColModalOpen(false)} className="text-gray-400 hover:text-white text-2xl">&times;</button>
                                </div>
                                
                                <form onSubmit={handleSaveCollection} className="flex-1 flex flex-col lg:flex-row gap-8">
                                    {/* Coluna Esquerda: Dados Gerais e Peças */}
                                    <div className="flex-1 space-y-6">
                                        <div>
                                            <label className="block text-xs text-gray-400 uppercase mb-1">Nome da Coleção</label>
                                            <input type="text" className="admin-input text-lg" required value={colForm.name} onChange={e => setColForm({...colForm, name: e.target.value})} placeholder="Ex: Coleção Fases da Lua" />
                                        </div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs text-gray-400 uppercase mb-1">Status</label>
                                                <select className="admin-input" value={colForm.status} onChange={e => setColForm({...colForm, status: e.target.value})}>
                                                    <option>Ideação</option>
                                                    <option>Produção</option>
                                                    <option>Marketing / Fotos</option>
                                                    <option>Lançada</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs text-gray-400 uppercase mb-1">Data Lançamento (Alvo)</label>
                                                <input type="date" className="admin-input" value={colForm.targetDate} onChange={e => setColForm({...colForm, targetDate: e.target.value})} />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-400 uppercase mb-1">Tema / Inspiração</label>
                                            <textarea className="admin-input h-20" value={colForm.theme} onChange={e => setColForm({...colForm, theme: e.target.value})} placeholder="Descreva o sentimento, cores e referências..."></textarea>
                                        </div>

                                        <div className="bg-gray-800/30 p-4 rounded-xl border border-gray-700">
                                            <h4 className="text-sm font-bold text-ouro mb-3 uppercase tracking-widest">🧩 Peças da Coleção</h4>
                                            <div className="flex gap-2 mb-4">
                                                <input type="text" className="admin-input flex-1" value={newPieceName} onChange={e => setNewPieceName(e.target.value)} placeholder="Nova peça (Ex: Prato Crescente)" onKeyPress={e => e.key === 'Enter' && (e.preventDefault(), handleAddPiece())} />
                                                <button type="button" onClick={handleAddPiece} className="bg-gray-700 text-white px-3 rounded hover:bg-gray-600 font-bold">+</button>
                                            </div>
                                            <ul className="space-y-2 max-h-40 overflow-y-auto pr-2">
                                                {colForm.pieces.length === 0 && <p className="text-xs text-gray-500 italic">Nenhuma peça adicionada ainda.</p>}
                                                {colForm.pieces.map(p => (
                                                    <li key={p.id} className="flex justify-between items-center text-sm bg-admincard p-2 rounded border border-gray-700">
                                                        <label className="flex items-center gap-2 cursor-pointer flex-1">
                                                            <input type="checkbox" checked={p.done} onChange={() => togglePiece(p.id)} className="w-4 h-4 rounded border-gray-600 text-ouro focus:ring-ouro focus:ring-offset-gray-800" />
                                                            <span className={p.done ? 'line-through text-gray-500' : 'text-white'}>{p.name}</span>
                                                        </label>
                                                        <button type="button" onClick={() => deletePiece(p.id)} className="text-gray-500 hover:text-red-400">✕</button>
                                                    </li>
                                                ))}
                                            </ul>
                                        </div>
                                    </div>

                                    {/* Coluna Direita: Checklist Marketing */}
                                    <div className="w-full lg:w-1/2 bg-gray-800/30 p-4 rounded-xl border border-gray-700 flex flex-col">
                                        <h4 className="text-sm font-bold text-ouro mb-1 uppercase tracking-widest">✅ Checklist de Lançamento</h4>
                                        <p className="text-[10px] text-gray-400 mb-4">Organize o marketing e produção da coleção.</p>
                                        
                                        <div className="flex gap-2 mb-4">
                                            <input type="text" className="admin-input flex-1" value={newTaskName} onChange={e => setNewTaskName(e.target.value)} placeholder="Nova tarefa (Ex: Gravar Reels)" onKeyPress={e => e.key === 'Enter' && (e.preventDefault(), handleAddTask())} />
                                            <button type="button" onClick={handleAddTask} className="bg-gray-700 text-white px-3 rounded hover:bg-gray-600 font-bold">+</button>
                                        </div>
                                        
                                        <ul className="space-y-2 flex-1 overflow-y-auto pr-2">
                                            {colForm.tasks.map(t => (
                                                <li key={t.id} className="flex justify-between items-center text-sm bg-admincard p-2 rounded border border-gray-700 hover:border-gray-500 transition-colors">
                                                    <label className="flex items-center gap-3 cursor-pointer flex-1">
                                                        <input type="checkbox" checked={t.done} onChange={() => toggleTask(t.id)} className="w-4 h-4 rounded border-gray-600 text-ouro focus:ring-ouro" />
                                                        <span className={t.done ? 'line-through text-gray-500' : 'text-white'}>{t.title}</span>
                                                    </label>
                                                    <button type="button" onClick={() => deleteTask(t.id)} className="text-gray-500 hover:text-red-400 ml-2">✕</button>
                                                </li>
                                            ))}
                                        </ul>

                                        <div className="mt-6 pt-4 border-t border-gray-700">
                                            <button type="submit" className="w-full py-3 bg-ouro text-adminbg font-bold rounded-lg text-sm hover:bg-ouroclaro transition shadow-lg">
                                                Salvar Coleção
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    <aside className="w-full md:w-64 bg-admincard border-r border-gray-800 flex flex-col z-10 relative">
                        <div className="p-6 border-b border-gray-800 flex items-center gap-3">
                            <LogoOficina size={40} />
                            <div>
                                <h2 className="font-serif text-ouro font-bold leading-tight">Ateliê<br/>Admin</h2>
                            </div>
                        </div>
                        <nav className="flex-1 p-4 space-y-2 text-sm overflow-y-auto no-scrollbar">
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full text-left px-4 py-3 rounded-lg transition-colors ${activeTab === 'dashboard' ? 'bg-ouro/10 text-ouro' : 'text-gray-400 hover:bg-gray-800'}`}>📅 Visão Geral & Finanças</button>
                            <button onClick={() => setActiveTab('encomendas')} className={`w-full text-left px-4 py-3 rounded-lg transition-colors flex justify-between ${activeTab === 'encomendas' ? 'bg-ouro/10 text-ouro' : 'text-gray-400 hover:bg-gray-800'}`}>
                                📦 Encomendas {orders.filter(o => o.status !== 'Entregue').length > 0 && <span className="bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full">{orders.filter(o => o.status !== 'Entregue').length}</span>}
                            </button>
                            <button onClick={() => setActiveTab('colecoes')} className={`w-full text-left px-4 py-3 rounded-lg transition-colors flex justify-between ${activeTab === 'colecoes' ? 'bg-ouro/10 text-ouro' : 'text-gray-400 hover:bg-gray-800'}`}>
                                ✨ Coleções & Lançamentos
                            </button>
                            <button onClick={() => setActiveTab('estampas')} className={`w-full text-left px-4 py-3 rounded-lg transition-colors flex justify-between ${activeTab === 'estampas' ? 'bg-ouro/10 text-ouro' : 'text-gray-400 hover:bg-gray-800'}`}>
                                📔 Estampas (Cadernos)
                            </button>
                            <button onClick={() => setActiveTab('insumos')} className={`w-full text-left px-4 py-3 rounded-lg transition-colors ${activeTab === 'insumos' ? 'bg-ouro/10 text-ouro' : 'text-gray-400 hover:bg-gray-800'}`}>🎨 Insumos</button>
                            <button onClick={() => setActiveTab('galeria')} className={`w-full text-left px-4 py-3 rounded-lg transition-colors ${activeTab === 'galeria' ? 'bg-ouro/10 text-ouro' : 'text-gray-400 hover:bg-gray-800'}`}>🖼️ Galeria & Obras (Site)</button>
                        </nav>
                        <div className="p-4 border-t border-gray-800">
                            <button onClick={onLogout} className="w-full px-4 py-2 text-red-400 text-xs font-bold uppercase tracking-wider hover:bg-red-900/20 rounded-lg">Sair do Painel</button>
                        </div>
                    </aside>

                    <main className="flex-1 p-6 md:p-10 overflow-y-auto">
                        
                        {activeTab === 'dashboard' && (
                            <div className="space-y-10 fade-in">
                                <div>
                                    <h2 className="text-2xl font-serif text-white mb-6">Resumo do Ateliê</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                        <div className="bg-admincard p-6 rounded-xl border border-gray-800">
                                            <h3 className="text-gray-400 text-[10px] uppercase tracking-wider mb-2">Faturamento (Vendas Concluídas)</h3>
                                            <p className="text-2xl font-bold text-white">R$ {totalRevenue.toFixed(2)}</p>
                                        </div>
                                        <div className="bg-admincard p-6 rounded-xl border border-gray-800">

                                <h2 className="text-2xl font-serif text-white">Galeria & Obras (Site)</h2>
                                <p className="text-sm text-gray-400">Gerencie as obras que estão disponíveis no seu portfólio público.</p>

                                {artworks.filter(a => a.category !== 'Cerâmica / Biscuit').length === 0 && (
                                    <div className="bg-blue-900/30 border border-blue-500/50 p-4 rounded-xl flex justify-between items-center mb-6">
                                        <div>
                                            <h4 className="text-blue-400 font-bold text-sm">Importar Galeria Inicial</h4>
                                            <p className="text-gray-400 text-xs mt-1">Clique ao lado para carregar as pinturas, processos e artes de suspiro que você configurou inicialmente. Assim, elas ficarão salvas no banco de dados e você poderá editar os títulos!</p>
                                        </div>
                                        <button onClick={importInitialGallery} disabled={isImporting} className="bg-blue-600 text-white px-4 py-2 rounded text-xs font-bold hover:bg-blue-500 flex-shrink-0 ml-4 transition-colors">
                                            {isImporting ? 'Importando...' : 'Importar Imagens'}
                                        </button>
                                    </div>
                                )}
                                
                                <form onSubmit={handleAddArtwork} className="bg-admincard p-6 rounded-xl border border-gray-800 grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs text-gray-400 uppercase mb-1">Nome da Obra</label>
                                        <input type="text" className="admin-input" required value={artForm.name} onChange={e => setArtForm({...artForm, name: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs text-gray-400 uppercase mb-1">Preço (Ex: 40,00)</label>
                                            <input type="text" className="admin-input" required value={artForm.price} onChange={e => setArtForm({...artForm, price: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-400 uppercase mb-1">Categoria</label>
                                            <select className="admin-input" value={artForm.category} onChange={e => setArtForm({...artForm, category: e.target.value})}>
                                                <option>Cerâmica / Biscuit</option>
                                                <option>Pintura - Acrílica</option>
                                                <option>Pintura - Aquarela</option>
                                                <option>Processo Criativo</option>
                                                <option>Arte de Suspiro</option>
                                                <option>Pintura / Ilustração</option>
                                            </select>
                                        </div>
                                    </div>
                                    
                                    <div className="md:col-span-2 border border-gray-700 p-4 rounded-xl bg-gray-800/30 mt-2">
                                        <label className="block text-xs text-ouro uppercase mb-3 font-bold">Imagens da Obra (Até 4 fotos)</label>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {[0, 1, 2, 3].map(idx => (
                                                <div key={idx}>
                                                    <label className="block text-[10px] text-gray-400 uppercase mb-1">Imagem {idx + 1} {idx === 0 ? '(Principal)' : ''}</label>
                                                    <input type="url" className="admin-input" required={idx === 0 && !editingArtworkId} value={(artForm.images || [])[idx] || ''} onChange={e => {
                                                        const newImages = [...(artForm.images || ['', '', '', ''])];
                                                        newImages[idx] = e.target.value;
                                                        setArtForm({...artForm, images: newImages});
                                                    }} placeholder="URL do Google Drive, Canva, etc..." />
                                                </div>
                                            ))}
                                        </div>
                                        <p className="text-[10px] text-gray-500 mt-3 font-medium">✨ Cole o link inteiro de compartilhamento do Google Drive que o sistema adapta automaticamente.</p>
                                    </div>

                                    <div className="md:col-span-2">
                                        <label className="block text-xs text-gray-400 uppercase mb-1">Descrição</label>
                                        <textarea className="admin-input h-20" value={artForm.desc} onChange={e => setArtForm({...artForm, desc: e.target.value})}></textarea>
                                    </div>
                                    <div className="md:col-span-2 flex gap-2 mt-2">
                                        <button type="submit" className="bg-ouro text-adminbg font-bold px-6 py-3 rounded-lg hover:bg-ouroclaro flex-1 transition">
                                            {editingArtworkId ? 'Salvar Alterações' : 'Publicar Nova Obra'}
                                        </button>
                                        {editingArtworkId && (
                                            <button type="button" onClick={cancelEditArtwork} className="bg-gray-700 text-white font-bold px-6 py-3 rounded-lg hover:bg-gray-600 transition">
                                                Cancelar Edição
                                            </button>
                                        )}
                                    </div>
                                </form>

                                <div className="mt-8">
                                    <div className="flex gap-2 mb-4 overflow-x-auto pb-2 no-scrollbar">
                                        {['Todas', 'Cerâmica / Biscuit', 'Pintura - Acrílica', 'Pintura - Aquarela', 'Processo Criativo', 'Arte de Suspiro'].map(cat => (
                                            <button key={cat} onClick={() => setFilterCategory(cat)} className={`px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap ${filterCategory === cat ? 'bg-ouro text-adminbg' : 'bg-gray-800 text-gray-400 hover:text-white transition'}`}>{cat}</button>
                                        ))}
                                    </div>

                                    <div className="grid md:grid-cols-3 gap-6 pt-4">
                                        {artworks.filter(a => filterCategory === 'Todas' || a.category === filterCategory).map(art => {
                                            const displayImage = art.images && art.images.length > 0 && art.images[0] ? art.images[0] : art.image;
                                            return (
                                                <div key={art.id} className="bg-admincard border border-gray-800 rounded-xl overflow-hidden shadow-lg group flex flex-col">
                                                    <div className="aspect-square bg-gray-900 relative">
                                                        {displayImage ? (
                                                            <img src={displayImage} className="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition" />
                                                        ) : (
                                                            <div className="w-full h-full flex items-center justify-center text-gray-500 text-xs italic">Sem imagem</div>
                                                        )}
                                                        <span className="absolute top-2 right-2 bg-black/80 text-white text-[10px] px-2 py-1 rounded uppercase tracking-widest">{art.category.split('/')[0].split('-')[0].trim()}</span>
                                                        {art.images && art.images.filter(i=>i).length > 1 && (
                                                            <span className="absolute bottom-2 left-2 bg-black/80 text-white text-[10px] px-2 py-1 rounded font-bold tracking-widest">+ {art.images.filter(i=>i).length - 1} FOTOS</span>
                                                        )}
                                                    </div>
                                                    <div className="p-4 flex flex-col gap-2 flex-1">
                                                        <div>
                                                            <h4 className={`font-serif text-lg truncate ${art.name === 'Sem Título' ? 'text-gray-500 italic' : 'text-ouro'}`} title={art.name}>{art.name}</h4>
                                                            <p className="text-sm text-white font-bold mb-2">R$ {art.price}</p>
                                                        </div>
                                                        <div className="flex gap-2 mt-auto pt-2">
                                                            <button onClick={() => handleEditArtwork(art)} className="flex-1 py-2 border border-gray-700 text-gray-300 rounded hover:bg-gray-700 text-xs font-bold uppercase transition">Editar</button>
                                                            <button onClick={() => handleDeleteArtwork(art.id)} className="flex-1 py-2 border border-red-900/50 text-red-400 rounded hover:bg-red-900/30 text-xs font-bold uppercase transition">Excluir</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                    {artworks.filter(a => filterCategory === 'Todas' || a.category === filterCategory).length === 0 && (
                                        <p className="text-center text-gray-500 py-8">Nenhuma obra encontrada nesta categoria.</p>
                                    )}
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            )
        };

        // ==========================================
        // COMPONENTE PRINCIPAL (ROTEADOR + AUTH)
        // ==========================================
        function App() {
            const [view, setView] = useState('public');
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [firebaseReady, setFirebaseReady] = useState(!!window.fbAuth);

            useEffect(() => {
                if (!window.fbAuth) {
                    const handleReady = () => setFirebaseReady(true);
                    window.addEventListener('firebase-ready', handleReady);
                    return () => window.removeEventListener('firebase-ready', handleReady);
                }
            }, []);

            useEffect(() => {
                if (!firebaseReady) return;
                const { fbAuth, fbMethods: { onAuthStateChanged, signInAnonymously } } = window;
                
                const initAuth = async () => {
                    if (!fbAuth.currentUser) await signInAnonymously(fbAuth).catch(err => console.log(err));
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(fbAuth, setUser);
                return () => unsubscribe();
            }, [firebaseReady]);

            const handleLogin = async (e) => {
                e.preventDefault();
                try {
                    await window.fbMethods.signInWithEmailAndPassword(window.fbAuth, email, password);
                    setView('admin');
                } catch (error) {
                    alert("Acesso Negado. Verifique o email e a senha cadastrados no Firebase.");
                }
            };

            const handleLogout = async () => {
                await window.fbMethods.signOut(window.fbAuth);
                setView('public');
                setEmail(''); setPassword('');
            };

            if (view === 'public') return <PublicSite navigateToAdmin={() => setView('login')} user={user} />;

            if (view === 'login') {
                return (
                    <div className="min-h-screen bg-adminbg flex flex-col justify-center items-center p-4">
                        <div className="bg-admincard p-8 rounded-2xl border border-gray-800 w-full max-w-md shadow-2xl fade-in">
                            <div className="flex justify-center mb-6"><LogoOficina size={80} /></div>
                            <h2 className="text-2xl font-serif text-ouro text-center mb-6">Acesso ao Ateliê</h2>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div><label className="block text-xs text-gray-400 uppercase tracking-widest mb-1">E-mail</label><input type="email" required className="admin-input" value={email} onChange={e => setEmail(e.target.value)} /></div>
                                <div><label className="block text-xs text-gray-400 uppercase tracking-widest mb-1">Senha</label><input type="password" required className="admin-input" value={password} onChange={e => setPassword(e.target.value)} /></div>
                                <button type="submit" className="w-full bg-ouro text-adminbg font-bold py-3 rounded-lg hover:bg-ouroclaro mt-4">Entrar no Painel</button>
                            </form>
                            <button onClick={() => setView('public')} className="w-full text-center text-xs text-gray-500 hover:text-white mt-6">Voltar para o site</button>
                        </div>
                    </div>
                );
            }

            if (view === 'admin' && user && !user.isAnonymous) return <AdminDashboard onLogout={handleLogout} user={user} />;
            else if (view === 'admin') setView('login');

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
