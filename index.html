<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina da Lua | Taylise Ink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuração de Cores e Fontes inspiradas no seu Logo -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fundo: '#202a36', // Fundo azul ardósia escuro do seu logo
                        card: '#2b3847',  // Fundo dos cartões ligeiramente mais claro
                        ouro: '#dca868',  // Dourado suave/bronze do logo
                        ouroclaro: '#f4ce83', // Dourado brilhante para as estrelas
                        texto: '#e2e8f0', // Texto claro e legível
                    },
                    fontFamily: {
                        serif: ['"Cinzel Decorative"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                        hand: ['"Dancing Script"', 'cursive']
                    }
                }
            }
        }
    </script>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Dancing+Script:wght@400;700&family=Inter:wght@300;400;600&display=swap');
        
        body {
            background-color: #202a36; /* Fallback css */
            color: #e2e8f0;
            margin: 0;
            overflow-x: hidden;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }

        .animate-float { animation: float 6s ease-in-out infinite; }

        .estrela-neon {
            filter: drop-shadow(0 0 6px rgba(244, 206, 131, 0.6));
        }

        .edit-input {
            background: rgba(255,255,255,0.05);
            border: 1px dashed #dca868;
            color: inherit;
            font-family: inherit;
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: all 0.3s;
        }
        .edit-input:focus {
            background: rgba(0,0,0,0.5);
            border-style: solid;
        }

        .glass-nav {
            background: rgba(32, 42, 54, 0.9);
            backdrop-filter: blur(15px);
            border-color: rgba(220, 168, 104, 0.2);
        }

        .paper-texture {
            background-image: url('https://www.transparenttextures.com/patterns/handmade-paper.png');
            mix-blend-mode: overlay;
        }

        .fade-in { animation: fadeIn 0.8s ease-out forwards; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-input {
            background: #2b3847;
            border: 1px solid rgba(220, 168, 104, 0.3);
            color: white;
            padding: 12px;
            border-radius: 12px;
            width: 100%;
            outline: none;
            transition: border 0.3s;
        }
        .form-input:focus { border-color: #dca868; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-fundo text-texto font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // --- LOGO: IMAGEM ORIGINAL DO CANVA ---
        const LogoOficina = ({ size = 80 }) => {
            const [imgError, setImgError] = useState(false);
            
            return (
                <div className="relative animate-float flex items-center justify-center" style={{ width: size, height: size }}>
                    {!imgError ? (
                        <img 
                            src="Logo.png" 
                            alt="Logo Oficina da Lua" 
                            className="w-full h-full object-contain drop-shadow-[0_0_15px_rgba(220,168,104,0.4)]"
                            onError={() => setImgError(true)}
                        />
                    ) : (
                        <div className="w-full h-full rounded-full border border-dashed border-[#dca868] flex items-center justify-center p-2 text-center bg-black/40 backdrop-blur">
                            <span className="text-[#dca868] text-[8px] font-sans font-bold uppercase">Salve como logo.png</span>
                        </div>
                    )}
                </div>
            );
        };

        const Editable = ({ isEditMode, value, onSave, className = "", textarea = false }) => {
            if (!isEditMode) return <span className={className} dangerouslySetInnerHTML={{__html: value.replace(/\n/g, '<br/>')}}></span>;
            return textarea ? 
                <textarea className={`edit-input ${className}`} value={value} onChange={e => onSave(e.target.value)} /> :
                <input className={`edit-input ${className}`} value={value} onChange={e => onSave(e.target.value)} />;
        };

        function App() {
            const [section, setSection] = useState('inicio');
            const [isEditMode, setIsEditMode] = useState(false);
            
            // --- TEXTOS AUTORAIS ---
            const [data, setData] = useState({
                h1: "Arte Feita à Mão com Alma e Magia",
                h2: "Bem-vindo(a) à Oficina da Lua!",
                h3: "Meu trabalho é um mergulho nos mundos do desenho, da pintura e da cerâmica, criando peças únicas que levam mais cor e afeto para o seu cotidiano.",
                sobreTitle: "Seja bem-vindo ao meu mundo",
                sobreBio: "Oi, eu sou a Tay! Aqui, a arte é a linguagem que uso para explorar a natureza, o misticismo e a beleza dos corpos femininos. Tudo o que verá nasce de um lugar de afeto e de um olhar que encontra magia no sensível e no sombrio.",
                sobreArtist: "Sou artista visual independente, estudante de Geografia e tatuadora em formação. Misturo minha paixão por artes, natureza e misticismo. Trabalho com grafite, pintura e tattoo (com uma pegada dark e delicada).",
                cadTitle: "Cadernos Artesanais",
                cadDesc: "Para quem ama escrever, desenhar ou fazer journals. Cada caderno é montado à mão para oferecer uma experiência única e inspiradora.",
            });

            // --- CATÁLOGOS EDITÁVEIS ---
            const [arts, setArts] = useState([
                { id: 1, name: "Incensário Artesanal", desc: "Peça decorativa funcional, com estética mística. Produção manual e design autoral.", price: "40,00", image: "https://images.unsplash.com/photo-1602928321679-560bb453f190?auto=format&fit=crop&w=600&q=80" },
                { id: 2, name: "Caixinha de Joias", desc: "Estrutura firme e acabamento detalhado para guardar acessórios e pequenos objetos.", price: "60,00", image: "https://images.unsplash.com/photo-1582142306909-195724d339c4?auto=format&fit=crop&w=600&q=80" }
            ]);

            const [paintings, setPaintings] = useState([
                { id: 1, name: "Ilustração Botânica Dark", desc: "Arte original em nanquim, explorando o misticismo e a natureza.", price: "120,00", image: "https://images.unsplash.com/photo-1513689125086-6c432170e843?auto=format&fit=crop&w=600&q=80" },
                { id: 2, name: "Pintura Corpo Feminino", desc: "Aquarela autoral com toques sensíveis e sombrios.", price: "150,00", image: "https://images.unsplash.com/photo-1544816153-12ad5d714b21?auto=format&fit=crop&w=600&q=80" }
            ]);

            const [stamps, setStamps] = useState([
                { id: 1, name: "Melancia Encantada", image: "https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?auto=format&fit=crop&w=400&q=80" },
                { id: 2, name: "Sol Dourado", image: "https://images.unsplash.com/photo-1535632066927-ab7c9ab60908?auto=format&fit=crop&w=400&q=80" },
                { id: 3, name: "Pó de Estrela", image: "https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=400&q=80" }
            ]);

            const [aboutGallery, setAboutGallery] = useState([
                "https://images.unsplash.com/photo-1583162815141-893f45814582?auto=format&fit=crop&w=800&q=80",
                "https://images.unsplash.com/photo-1598300042247-d088f8ab3a91?auto=format&fit=crop&w=800&q=80"
            ]);

            const [orderForm, setOrderForm] = useState({ name: '', type: 'Arte Personalizada', idea: '' });

            // --- FUNÇÕES DE UPDATE ---
            const updateData = (key, val) => setData(prev => ({ ...prev, [key]: val }));
            
            const addArt = () => setArts([{ id: Date.now(), name: "Nova Arte", desc: "Descrição da peça...", price: "0,00", image: "" }, ...arts]);
            const removeArt = (id) => setArts(arts.filter(a => a.id !== id));
            const updateArt = (id, field, val) => setArts(arts.map(a => a.id === id ? {...a, [field]: val} : a));

            const addPainting = () => setPaintings([{ id: Date.now(), name: "Nova Pintura", desc: "Técnica e detalhes...", price: "0,00", image: "" }, ...paintings]);
            const removePainting = (id) => setPaintings(paintings.filter(p => p.id !== id));
            const updatePainting = (id, field, val) => setPaintings(paintings.map(p => p.id === id ? {...p, [field]: val} : p));

            const addStamp = () => setStamps([...stamps, { id: Date.now(), name: "Nova Estampa", image: "" }]);
            const removeStamp = (id) => setStamps(stamps.filter(s => s.id !== id));
            const updateStamp = (id, field, val) => setStamps(stamps.map(s => s.id === id ? {...s, [field]: val} : s));

            const addAboutImg = () => setAboutGallery([...aboutGallery, ""]);
            const updateAboutImg = (idx, val) => setAboutGallery(aboutGallery.map((img, i) => i === idx ? val : img));
            const removeAboutImg = (idxToRemove) => setAboutGallery(aboutGallery.filter((_, i) => i !== idxToRemove));

            const handleOrderSubmit = () => {
                if (!orderForm.name || !orderForm.idea) return alert("Preencha seu nome e a sua ideia mágica!");
                const msg = `Olá Tay! ✨\nSou *${orderForm.name}*.\nQuero encomendar: *${orderForm.type}*\n\nMinha ideia:\n"${orderForm.idea}"`;
                window.open(`https://wa.me/5551981749825?text=${encodeURIComponent(msg)}`);
            };

            const stars = useMemo(() => [...Array(25)].map((_, i) => ({
                id: i, top: `${Math.random() * 100}%`, left: `${Math.random() * 100}%`, size: Math.random() * 15 + 8, delay: `${Math.random() * 5}s`
            })), []);

            return (
                <div className="min-h-screen relative pb-24 md:pb-0 md:pt-24 selection:bg-ouro/30">
                    <div className="fixed inset-0 pointer-events-none z-[1] paper-texture opacity-10"></div>
                    <div className="fixed inset-0 pointer-events-none z-0">
                        {stars.map(s => (
                            <svg key={s.id} viewBox="0 0 24 24" fill="currentColor" 
                                 className="absolute text-ouroclaro/10 animate-pulse" 
                                 style={{ top: s.top, left: s.left, width: s.size, animationDelay: s.delay }}>
                                <path d="M12 17.27L18.18 21L16.54 13.97L22 9.24L14.81 8.63L12 2L9.19 8.63L2 9.24L7.46 13.97L5.82 21L12 17.27Z" />
                            </svg>
                        ))}
                    </div>

                    {/* NAVBAR PC */}
                    <nav className="hidden md:flex fixed top-0 w-full h-24 glass-nav z-50 border-b px-12 justify-between items-center shadow-lg">
                        <div className="flex items-center gap-4 cursor-pointer group" onClick={() => setSection('inicio')}>
                            <LogoOficina size={65} />
                            <div className="flex items-baseline gap-2">
                                <h1 className="text-3xl font-serif text-ouro drop-shadow-md">Oficina</h1>
                                <span className="font-hand text-2xl text-texto">da</span>
                                <h1 className="text-3xl font-serif text-ouro drop-shadow-md">Lua</h1>
                            </div>
                        </div>
                        <div className="flex gap-10 font-sans text-xs uppercase tracking-[0.2em] font-bold">
                            <button onClick={() => setSection('inicio')} className={section === 'inicio' ? 'text-ouro border-b-2 border-ouro' : 'text-slate-400 hover:text-ouro transition-colors pb-0.5 border-b-2 border-transparent'}>Artes</button>
                            <button onClick={() => setSection('pinturas')} className={section === 'pinturas' ? 'text-ouro border-b-2 border-ouro' : 'text-slate-400 hover:text-ouro transition-colors pb-0.5 border-b-2 border-transparent'}>Pinturas</button>
                            <button onClick={() => setSection('cadernos')} className={section === 'cadernos' ? 'text-ouro border-b-2 border-ouro' : 'text-slate-400 hover:text-ouro transition-colors pb-0.5 border-b-2 border-transparent'}>Cadernos</button>
                            <button onClick={() => setSection('sobre')} className={section === 'sobre' ? 'text-ouro border-b-2 border-ouro' : 'text-slate-400 hover:text-ouro transition-colors pb-0.5 border-b-2 border-transparent'}>Sobre a Tay</button>
                        </div>
                    </nav>

                    {/* NAVBAR MOBILE */}
                    <nav className="md:hidden fixed bottom-0 w-full h-20 glass-nav z-50 border-t flex justify-around items-center px-2 shadow-[0_-10px_20px_rgba(0,0,0,0.3)]">
                        <button onClick={() => setSection('inicio')} className={`flex flex-col items-center gap-1 ${section === 'inicio' ? 'text-ouro' : 'text-slate-400'}`}>
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                            <span className="text-[8px] font-bold uppercase tracking-widest">Artes</span>
                        </button>
                        <button onClick={() => setSection('pinturas')} className={`flex flex-col items-center gap-1 ${section === 'pinturas' ? 'text-ouro' : 'text-slate-400'}`}>
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" /></svg>
                            <span className="text-[8px] font-bold uppercase tracking-widest">Pinturas</span>
                        </button>
                        <button onClick={() => setSection('cadernos')} className={`flex flex-col items-center gap-1 ${section === 'cadernos' ? 'text-ouro' : 'text-slate-400'}`}>
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                            <span className="text-[8px] font-bold uppercase tracking-widest">Cadernos</span>
                        </button>
                        <button onClick={() => setSection('sobre')} className={`flex flex-col items-center gap-1 ${section === 'sobre' ? 'text-ouro' : 'text-slate-400'}`}>
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                            <span className="text-[8px] font-bold uppercase tracking-widest">Sobre</span>
                        </button>
                    </nav>

                    {/* BOTAO MODO ATELIÊ */}
                    <button onClick={() => setIsEditMode(!isEditMode)} className="fixed bottom-24 right-6 md:bottom-10 md:right-10 z-[100] bg-ouro text-fundo px-6 py-3 rounded-full shadow-2xl hover:scale-105 transition-all flex items-center gap-2 font-sans font-bold text-[10px] uppercase tracking-widest">
                        {isEditMode ? '✓ Salvar Alterações' : '✎ Modo Ateliê'}
                    </button>

                    {/* --- CONTEÚDO --- */}
                    <main className="relative z-10 max-w-5xl mx-auto px-6 py-12 pt-32 md:pt-12 fade-in">
                        
                        {/* 1. SEÇÃO INÍCIO (CERÂMICAS/BISCUIT E HERO) */}
                        {section === 'inicio' && (
                            <div className="space-y-24">
                                <header className="text-center space-y-8 pt-8">
                                    <div className="flex justify-center mb-10"><LogoOficina size={180} /></div>
                                    <Editable isEditMode={isEditMode} value={data.h1} onSave={v => updateData('h1', v)} className="font-serif text-4xl md:text-7xl font-bold tracking-tighter block leading-none text-ouro" />
                                    <Editable isEditMode={isEditMode} value={data.h2} onSave={v => updateData('h2', v)} className="font-serif text-xl md:text-2xl text-slate-300 block" />
                                    <Editable isEditMode={isEditMode} textarea value={data.h3} onSave={v => updateData('h3', v)} className="font-sans text-lg text-slate-400 max-w-3xl mx-auto leading-relaxed block font-light" />
                                </header>

                                {/* Catálogo de Artes (Cerâmicas) */}
                                <div className="space-y-12">
                                    <div className="flex justify-between items-end border-b border-ouro/20 pb-4">
                                        <h3 className="font-serif text-3xl font-bold tracking-tighter text-ouro">Cerâmica e Biscuit</h3>
                                        {isEditMode && <button onClick={addArt} className="bg-ouro text-fundo px-4 py-2 rounded-lg text-xs font-bold font-sans">+ Nova Peça</button>}
                                    </div>
                                    
                                    <div className="grid md:grid-cols-2 gap-10">
                                        {arts.map(art => (
                                            <div key={art.id} className="group bg-card border border-ouro/10 rounded-[2.5rem] overflow-hidden flex flex-col hover:border-ouro/50 transition-all shadow-xl">
                                                <div className="aspect-[4/5] bg-slate-800 relative">
                                                    {art.image ? (
                                                        <img src={art.image} className="w-full h-full object-cover opacity-90 group-hover:opacity-100 group-hover:scale-105 transition-all duration-700" />
                                                    ) : (
                                                        <div className="w-full h-full flex items-center justify-center text-slate-500 italic text-sm font-sans">Sem Imagem</div>
                                                    )}
                                                    {isEditMode && (
                                                        <div className="absolute inset-0 bg-black/80 p-6 flex flex-col justify-center">
                                                            <label className="text-[10px] text-slate-400 uppercase mb-2 font-sans font-bold">Link da Imagem:</label>
                                                            <input className="edit-input" value={art.image} onChange={e => updateArt(art.id, 'image', e.target.value)} />
                                                        </div>
                                                    )}
                                                </div>
                                                <div className="p-8 space-y-4 flex-1 flex flex-col">
                                                    <div className="flex justify-between items-start mb-2">
                                                        <Editable isEditMode={isEditMode} className="font-serif text-2xl font-bold text-ouro leading-tight" value={art.name} onSave={v => updateArt(art.id, 'name', v)} />
                                                        <div className="text-right ml-4 font-sans">
                                                            <span className="text-[10px] text-slate-400 block uppercase tracking-widest font-bold">Valor</span>
                                                            <span className="text-lg font-bold text-texto">R$ <Editable isEditMode={isEditMode} value={art.price} onSave={v => updateArt(art.id, 'price', v)} /></span>
                                                        </div>
                                                    </div>
                                                    <Editable isEditMode={isEditMode} textarea className="font-sans text-slate-300 font-light block text-sm flex-1 leading-relaxed" value={art.desc} onSave={v => updateArt(art.id, 'desc', v)} />
                                                    
                                                    {isEditMode ? (
                                                        <button onClick={() => removeArt(art.id)} className="w-full py-3 bg-red-900/20 text-red-400 rounded-xl text-xs uppercase font-bold font-sans mt-4 hover:bg-red-900/40">Excluir Peça</button>
                                                    ) : (
                                                        <button onClick={() => {
                                                            document.getElementById('form-encomenda').scrollIntoView({ behavior: 'smooth' });
                                                            setOrderForm({...orderForm, type: 'Cerâmica / Biscuit', idea: `Olá! Amei a peça: ${art.name}`});
                                                        }} className="w-full font-sans text-[10px] uppercase tracking-[0.3em] font-bold border border-ouro/30 py-4 rounded-xl text-ouro mt-4 hover:bg-ouro hover:text-fundo transition-all">Encomendar Magia</button>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* FORMULÁRIO DE ENCOMENDA MÍSTICA */}
                                <div id="form-encomenda" className="bg-card p-8 md:p-16 rounded-[3rem] border border-ouro/20 shadow-2xl relative overflow-hidden">
                                    <div className="absolute -top-10 -right-10 opacity-5 rotate-12 pointer-events-none"><LogoOficina size={250} /></div>
                                    <div className="max-w-xl mx-auto space-y-8 relative z-10">
                                        <div className="text-center space-y-4 mb-10">
                                            <h3 className="font-serif text-4xl md:text-5xl font-bold tracking-tighter text-ouro">Faça sua Encomenda</h3>
                                            <p className="font-sans text-slate-300 font-light text-lg">De cerâmicas a ilustrações, vamos transformar a sua imaginação em arte.</p>
                                        </div>
                                        <div className="grid gap-5">
                                            <input type="text" placeholder="Qual o seu nome?" className="form-input font-sans text-sm" 
                                                   value={orderForm.name} onChange={e => setOrderForm({...orderForm, name: e.target.value})} />
                                            
                                            <select className="form-input font-sans text-slate-300 text-sm" 
                                                    value={orderForm.type} onChange={e => setOrderForm({...orderForm, type: e.target.value})}>
                                                <option>Cerâmica / Biscuit</option>
                                                <option>Pintura / Ilustração</option>
                                                <option>Caderno Artesanal Personalizado</option>
                                                <option>Orçamento para Tatuagem</option>
                                            </select>
                                            
                                            <textarea placeholder="Me conte sua ideia! (Cores, referências, sentimentos da peça...)" 
                                                      className="form-input font-sans text-sm h-32 resize-none"
                                                      value={orderForm.idea} onChange={e => setOrderForm({...orderForm, idea: e.target.value})}></textarea>
                                            
                                            <button onClick={handleOrderSubmit} className="w-full bg-ouro text-fundo py-5 rounded-xl font-sans font-bold text-xs uppercase tracking-widest hover:bg-ouroclaro transition-all shadow-lg shadow-ouro/20 mt-2">
                                                Enviar Encomenda (WhatsApp)
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 2. NOVA SEÇÃO PINTURAS */}
                        {section === 'pinturas' && (
                            <div className="space-y-20 fade-in">
                                <div className="text-center space-y-8">
                                    <h2 className="font-serif text-5xl md:text-7xl font-bold tracking-tighter text-ouro">Galeria de Pinturas</h2>
                                    <p className="font-sans text-slate-300 text-lg max-w-2xl mx-auto font-light">Quadros e desenhos originais para dar vida às suas paredes. Explorando o lado sombrio e sensível da estética.</p>
                                </div>

                                <div className="space-y-12">
                                    <div className="flex justify-between items-center border-b border-ouro/20 pb-4">
                                        <h3 className="font-serif text-2xl font-bold tracking-tighter text-ouro">Obras Disponíveis</h3>
                                        {isEditMode && <button onClick={addPainting} className="bg-ouro text-fundo px-4 py-2 rounded-lg text-xs font-bold font-sans">+ Nova Pintura</button>}
                                    </div>
                                    
                                    <div className="grid md:grid-cols-2 gap-12">
                                        {paintings.map(paint => (
                                            <div key={paint.id} className="group bg-card border border-ouro/10 rounded-3xl overflow-hidden shadow-2xl p-6">
                                                <div className="aspect-square bg-slate-800 rounded-2xl overflow-hidden relative">
                                                    {paint.image ? (
                                                        <img src={paint.image} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-1000" />
                                                    ) : (
                                                        <div className="w-full h-full flex items-center justify-center text-slate-500 italic font-sans text-sm">Sem Imagem</div>
                                                    )}
                                                    {isEditMode && (
                                                        <div className="absolute inset-0 bg-black/80 p-6 flex flex-col justify-center">
                                                            <label className="font-sans text-[10px] text-slate-400 font-bold uppercase mb-2">Link da Pintura:</label>
                                                            <input className="edit-input" value={paint.image} onChange={e => updatePainting(paint.id, 'image', e.target.value)} />
                                                        </div>
                                                    )}
                                                </div>
                                                <div className="pt-8 space-y-3 font-sans">
                                                    <Editable isEditMode={isEditMode} className="font-serif text-2xl font-bold text-ouro block" value={paint.name} onSave={v => updatePainting(paint.id, 'name', v)} />
                                                    <Editable isEditMode={isEditMode} textarea className="text-slate-300 font-light text-sm block leading-relaxed" value={paint.desc} onSave={v => updatePainting(paint.id, 'desc', v)} />
                                                    <div className="flex justify-between items-center pt-4 border-t border-ouro/10 mt-4">
                                                        <span className="text-xl font-bold text-texto">R$ <Editable isEditMode={isEditMode} value={paint.price} onSave={v => updatePainting(paint.id, 'price', v)} /></span>
                                                        
                                                        {isEditMode ? (
                                                            <button onClick={() => removePainting(paint.id)} className="text-red-400 text-xs font-bold uppercase">Excluir</button>
                                                        ) : (
                                                            <button onClick={() => {
                                                                setSection('inicio');
                                                                setTimeout(() => document.getElementById('form-encomenda').scrollIntoView({ behavior: 'smooth' }), 100);
                                                                setOrderForm({...orderForm, type: 'Pintura / Ilustração', idea: `Olá! Quero a obra: ${paint.name}`});
                                                            }} className="text-[10px] uppercase tracking-widest font-bold text-ouro hover:text-ouroclaro transition-colors bg-ouro/10 px-4 py-2 rounded-lg">Encomendar</button>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                {/* --- CATÁLOGO DO CANVA --- */}
                                <div className="space-y-8 text-center pt-16 mt-12 border-t border-ouro/10">
                                    <h3 className="font-serif text-3xl md:text-4xl font-bold tracking-tighter text-ouro">Catálogo Interativo</h3>
                                    <p className="font-sans text-slate-300 font-light text-lg">Folheie as nossas coleções, peças e inspirações diretamente aqui.</p>
                                    
                                    <div className="max-w-2xl mx-auto">
                                        <div style={{ position: 'relative', width: '100%', height: 0, paddingTop: '125.0000%', paddingBottom: 0, boxShadow: '0 20px 50px rgba(0,0,0,0.5)', marginTop: '1.6em', marginBottom: '0.9em', overflow: 'hidden', borderRadius: '1.5rem', willChange: 'transform' }}>
                                            <iframe loading="lazy" style={{ position: 'absolute', width: '100%', height: '100%', top: 0, left: 0, border: 'none', padding: 0, margin: 0 }}
                                                src="https://www.canva.com/design/DAHEUaqAQcs/HK7-ZaOPz2UAhCkcdMY-Lg/view?embed" allowFullScreen allow="fullscreen">
                                            </iframe>
                                        </div>
                                        <a href="https://www.canva.com/design/DAHEUaqAQcs/HK7-ZaOPz2UAhCkcdMY-Lg/view?utm_content=DAHEUaqAQcs&utm_campaign=designshare&utm_medium=embeds&utm_source=link" target="_blank" rel="noopener noreferrer" className="font-sans text-[10px] uppercase tracking-[0.2em] font-bold text-ouro hover:text-ouroclaro transition-colors mt-4 inline-block">
                                            Design de Patricia Andrea Santos Silveira (Abrir no Canva) ↗
                                        </a>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 3. SEÇÃO CADERNOS E ESTAMPAS */}
                        {section === 'cadernos' && (
                            <div className="space-y-24">
                                <div className="text-center space-y-8">
                                    <Editable isEditMode={isEditMode} value={data.cadTitle} onSave={v => updateData('cadTitle', v)} className="font-serif text-5xl md:text-7xl font-bold block tracking-tighter text-ouro" />
                                    <Editable isEditMode={isEditMode} textarea value={data.cadDesc} onSave={v => updateData('cadDesc', v)} className="font-sans text-slate-300 max-w-2xl mx-auto block font-light text-lg leading-relaxed" />
                                </div>

                                <div className="grid md:grid-cols-3 gap-8 font-sans">
                                    <div className="p-10 border border-ouro/20 rounded-3xl bg-card text-center space-y-4 shadow-lg">
                                        <h4 className="font-bold text-ouro uppercase text-xs tracking-widest">✓ Papel Pólen 90g</h4>
                                        <p className="text-sm text-slate-400 font-light">Ideal para escrita e desenho leve. 80 folhas (160 págs).</p>
                                    </div>
                                    <div className="p-10 border border-ouro/20 rounded-3xl bg-card text-center space-y-4 shadow-lg">
                                        <h4 className="font-bold text-ouro uppercase text-xs tracking-widest">✓ Costura Manual</h4>
                                        <p className="text-sm text-slate-400 font-light">Costura artesanal com linha encerada. Abertura 180º.</p>
                                    </div>
                                    <div className="p-10 border border-ouro/20 rounded-3xl bg-card text-center space-y-4 shadow-lg">
                                        <h4 className="font-bold text-ouro uppercase text-xs tracking-widest">✓ Acabamento</h4>
                                        <p className="text-sm text-slate-400 font-light">Cantoneiras de metal, elástico e capa de tecido personalizável.</p>
                                    </div>
                                </div>

                                <div className="space-y-12">
                                    <div className="flex justify-between items-center border-b border-ouro/20 pb-4">
                                        <h3 className="font-serif text-3xl font-bold tracking-tighter text-ouro">Catálogo de Estampas</h3>
                                        {isEditMode && <button onClick={addStamp} className="font-sans bg-ouro text-fundo px-4 py-2 rounded-lg text-xs font-bold">+ Nova Estampa</button>}
                                    </div>
                                    
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-8">
                                        {stamps.map(stamp => (
                                            <div key={stamp.id} className="space-y-4 group">
                                                <div className="aspect-[3/4] bg-card border border-ouro/20 rounded-2xl overflow-hidden relative shadow-2xl transition-all group-hover:border-ouro/50">
                                                    {stamp.image ? (
                                                        <img src={stamp.image} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
                                                    ) : (
                                                        <div className="w-full h-full flex items-center justify-center text-slate-500 italic text-xs font-sans">Sem Imagem</div>
                                                    )}
                                                    {isEditMode && (
                                                        <div className="absolute inset-0 bg-black/80 p-4 flex flex-col justify-center gap-3">
                                                            <input className="edit-input font-sans text-[10px]" placeholder="Link..." value={stamp.image} onChange={e => updateStamp(stamp.id, 'image', e.target.value)} />
                                                            <button onClick={() => removeStamp(stamp.id)} className="w-full py-2 border border-red-500 text-red-500 rounded font-sans text-[9px] uppercase font-bold hover:bg-red-500 hover:text-white">Excluir</button>
                                                        </div>
                                                    )}
                                                </div>
                                                <Editable isEditMode={isEditMode} className="font-sans text-xs uppercase tracking-[0.2em] font-bold block text-center text-slate-300" value={stamp.name} onSave={v => updateStamp(stamp.id, 'name', v)} />
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 4. SEÇÃO SOBRE A TAY */}
                        {section === 'sobre' && (
                            <div className="space-y-20">
                                <div className="space-y-8 text-center max-w-3xl mx-auto">
                                    <Editable isEditMode={isEditMode} value={data.sobreTitle} onSave={v => updateData('sobreTitle', v)} className="font-serif text-5xl md:text-7xl font-bold text-ouro leading-none block tracking-tighter" />
                                    <Editable isEditMode={isEditMode} textarea value={data.sobreBio} onSave={v => updateData('sobreBio', v)} className="font-sans text-xl text-slate-300 leading-relaxed block font-light" />
                                </div>
                                
                                <div className="grid md:grid-cols-2 gap-12 pt-10 border-t border-ouro/20">
                                    <div className="bg-card p-10 rounded-3xl border border-ouro/20 hover:border-ouro/50 transition-colors shadow-lg">
                                        <h3 className="font-serif text-2xl font-bold tracking-tighter text-ouro mb-4">A Artista</h3>
                                        <Editable isEditMode={isEditMode} textarea value={data.sobreArtist} onSave={v => updateData('sobreArtist', v)} className="font-sans text-slate-300 leading-relaxed font-light block" />
                                    </div>
                                    <div className="bg-card p-10 rounded-3xl border border-ouro/20 hover:border-ouro/50 transition-colors shadow-lg">
                                        <h3 className="font-serif text-2xl font-bold tracking-tighter text-ouro mb-4">Taylise Ink Studio</h3>
                                        <p className="font-sans text-slate-300 leading-relaxed font-light">"Este é o meu estúdio, um espaço onde a tinta encontra a alma. Como tatuadora, meu foco é o blackwork, trazendo à pele elementos místicos, botânicos e a força do feminino."</p>
                                    </div>
                                </div>

                                <div className="space-y-6 pt-10">
                                    <div className="flex justify-between items-center border-b border-ouro/20 pb-4">
                                        <h3 className="font-serif text-3xl font-bold text-ouro tracking-tighter">Meu Universo Visual</h3>
                                        {isEditMode && <button onClick={addAboutImg} className="bg-ouro text-fundo px-4 py-2 rounded-lg font-sans text-xs font-bold">+ Nova Foto</button>}
                                    </div>
                                    <div className="grid grid-cols-2 md:grid-cols-3 gap-6">
                                        {aboutGallery.map((img, idx) => (
                                            <div key={idx} className="relative aspect-[4/5] bg-card rounded-3xl overflow-hidden border border-ouro/20 shadow-xl group">
                                                {img ? <img src={img} className="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700" /> : <div className="w-full h-full flex items-center justify-center text-slate-500 text-xs italic font-sans">Sem Imagem</div>}
                                                {isEditMode && (
                                                    <div className="absolute inset-0 bg-black/80 p-4 flex flex-col justify-center gap-4">
                                                        <input className="edit-input font-sans text-[10px]" placeholder="Link da foto..." value={img} onChange={e => updateAboutImg(idx, e.target.value)} />
                                                        <button onClick={() => removeAboutImg(idx)} className="text-red-400 font-sans text-[10px] uppercase font-bold border border-red-400 rounded py-2 hover:bg-red-400 hover:text-stone-900">Remover</button>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    <footer className="py-20 text-center border-t border-ouro/10 mt-20 opacity-60">
                        <div className="flex justify-center mb-6"><LogoOficina size={70} /></div>
                        <div className="font-serif text-ouro text-lg tracking-widest flex items-center justify-center gap-2">Oficina <span className="font-hand lowercase">da</span> Lua</div>
                        <p className="font-sans text-[8px] uppercase tracking-[0.4em] mt-4 text-slate-500">Taylise Ink • 2026</p>
                    </footer>
                    
                    <div className="md:hidden h-24"></div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
