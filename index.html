<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina da Lua | Taylise Ink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuração de Cores e Fontes -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        fundo: '#202a36',
                        card: '#2b3847', 
                        ouro: '#dca868', 
                        ouroclaro: '#f4ce83',
                        texto: '#e2e8f0',
                        adminbg: '#111827',
                        admincard: '#1f2937'
                    },
                    fontFamily: {
                        serif: ['"Cinzel Decorative"', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                        hand: ['"Dancing Script"', 'cursive']
                    }
                }
            }
        }
    </script>

    <!-- React e Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- FIREBASE MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDdiY8S8GN-OB7iFLZ34fVhbsGGOzICo3A",
            authDomain: "oficinadalua-574a7.firebaseapp.com",
            projectId: "oficinadalua-574a7",
            storageBucket: "oficinadalua-574a7.firebasestorage.app",
            messagingSenderId: "1073145705062",
            appId: "1:1073145705062:web:f1ad5a9d407a873e1273a7",
            measurementId: "G-8V4312YZR1"
        };
        
        const app = initializeApp(firebaseConfig);
        
        window.fbAuth = getAuth(app);
        window.fbDb = getFirestore(app);
        window.fbMethods = {
            signInWithEmailAndPassword, signOut, onAuthStateChanged, signInAnonymously,
            collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc
        };

        window.dispatchEvent(new Event('firebase-ready'));
    </script> 

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Dancing+Script:wght@400;700&family=Inter:wght@300;400;600&display=swap');
        
        body { background-color: #202a36; color: #e2e8f0; margin: 0; overflow-x: hidden; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-8px) rotate(1deg); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }

        .glass-nav {
            background: rgba(32, 42, 54, 0.9);
            backdrop-filter: blur(15px);
            border-color: rgba(220, 168, 104, 0.2);
        }

        .paper-texture {
            background-image: url('https://www.transparenttextures.com/patterns/handmade-paper.png');
            mix-blend-mode: overlay;
        }

        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-input {
            background: #2b3847; border: 1px solid rgba(220, 168, 104, 0.3);
            color: white; padding: 12px; border-radius: 12px; width: 100%; outline: none; transition: border 0.3s;
        }
        .form-input:focus { border-color: #dca868; }

        .admin-input {
            background: #374151; border: 1px solid #4b5563;
            color: white; padding: 8px 12px; border-radius: 6px; width: 100%; outline: none; font-size: 0.875rem;
        }
        .admin-input:focus { border-color: #dca868; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-fundo text-texto font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;
        const appId = "oficinalua"; 

        // --- COMPONENTE LOGO ---
        const LogoOficina = ({ size = 80 }) => {
            const driveImageUrl = "https://lh3.googleusercontent.com/d/1Hxt6UiA_FTS_iFwxhOTRM5HO3CXc27qs";
            return (
                <div className="relative animate-float flex items-center justify-center" style={{ width: size, height: size }}>
                    <img 
                        src={driveImageUrl} 
                        alt="Logo Oficina da Lua" 
                        className="w-full h-full object-contain drop-shadow-[0_0_15px_rgba(220,168,104,0.4)]"
                        onError={(e) => {
                            if (!e.target.dataset.retried) {
                                e.target.dataset.retried = "true";
                                e.target.src = "https://drive.google.com/thumbnail?id=1Hxt6UiA_FTS_iFwxhOTRM5HO3CXc27qs&sz=w800";
                            }
                        }}
                    />
                </div>
            );
        };

        // ==========================================
        // ÁREA PÚBLICA (CLIENTE)
        // ==========================================
        const PublicSite = ({ navigateToAdmin, user }) => {
            const [section, setSection] = useState('inicio');
            const [orderForm, setOrderForm] = useState({ name: '', type: 'Arte Personalizada', idea: '' });
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [artworks, setArtworks] = useState([]);

            useEffect(() => {
                if (!window.fbMethods) return;
                const { collection, onSnapshot } = window.fbMethods;
                const unsub = onSnapshot(collection(window.fbDb, 'artifacts', appId, 'public', 'data', 'artworks'), 
                    (snapshot) => {
                        setArtworks(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    }
                );
                return () => unsub();
            }, [user]);

            const arts = artworks.filter(a => a.category === 'Cerâmica / Biscuit');
            const paintings = artworks.filter(a => a.category === 'Pintura / Ilustração');

            const handleOrderSubmit = async () => {
                if (!orderForm.name || !orderForm.idea) return alert("Preencha seu nome e a sua ideia mágica!");
                if (!user) return alert("Conectando ao banco de dados... Tente novamente.");
                
                setIsSubmitting(true);
                try {
                    const { addDoc, collection } = window.fbMethods;
                    await addDoc(collection(window.fbDb, 'artifacts', appId, 'public', 'data', 'orders'), {
                        client: orderForm.name,
                        item: orderForm.type,
                        idea: orderForm.idea,
                        status: 'Novo',
                        deadline: '',
                        price: 0,
                        cost: 0,
                        createdAt: new Date().toISOString()
                    });

                    const msg = `Olá Tay! ✨\nSou *${orderForm.name}*.\nQuero encomendar: *${orderForm.type}*\n\nMinha ideia:\n"${orderForm.idea}"`;
                    window.open(`https://wa.me/5551981749825?text=${encodeURIComponent(msg)}`);
                    
                    setOrderForm({ name: '', type: 'Arte Personalizada', idea: '' });
                    alert("Sua encomenda foi enviada para o ateliê!");
                } catch (error) {
                    console.error("Erro", error);
                    alert("Ocorreu um erro ao enviar.");
                } finally {
                    setIsSubmitting(false);
                }
            };

            const stars = useMemo(() => [...Array(25)].map((_, i) => ({
                id: i, top: `${Math.random() * 100}%`, left: `${Math.random() * 100}%`, size: Math.random() * 15 + 8, delay: `${Math.random() * 5}s`
            })), []);

            return (
                <div className="min-h-screen relative pb-24 md:pb-0 md:pt-24 selection:bg-ouro/30">
                    <div className="fixed inset-0 pointer-events-none z-[1] paper-texture opacity-10"></div>
                    <div className="fixed inset-0 pointer-events-none z-0">
                        {stars.map(s => (
                            <svg key={s.id} viewBox="0 0 24 24" fill="currentColor" className="absolute text-ouroclaro/10 animate-pulse" style={{ top: s.top, left: s.left, width: s.size, animationDelay: s.delay }}>
                                <path d="M12 17.27L18.18 21L16.54 13.97L22 9.24L14.81 8.63L12 2L9.19 8.63L2 9.24L7.46 13.97L5.82 21L12 17.27Z" />
                            </svg>
                        ))}
                    </div>

                    <nav className="hidden md:flex fixed top-0 w-full h-24 glass-nav z-50 border-b px-12 justify-between items-center shadow-lg">
                        <div className="flex items-center gap-4 cursor-pointer group" onClick={() => setSection('inicio')}>
                            <LogoOficina size={65} />
                            <div className="flex items-baseline gap-2">
                                <h1 className="text-3xl font-serif text-ouro drop-shadow-md">Oficina</h1>
                                <span className="font-hand text-2xl text-texto">da</span>
                                <h1 className="text-3xl font-serif text-ouro drop-shadow-md">Lua</h1>
                            </div>
                        </div>
                        <div className="flex gap-10 font-sans text-xs uppercase tracking-[0.2em] font-bold">
                            <button onClick={() => setSection('inicio')} className={section === 'inicio' ? 'text-ouro border-b-2 border-ouro' : 'text-slate-400 hover:text-ouro transition-colors pb-0.5 border-b-2 border-transparent'}>Artes</button>
                            <button onClick={() => setSection('pinturas')} className={section === 'pinturas' ? 'text-ouro border-b-2 border-ouro' : 'text-slate-400 hover:text-ouro transition-colors pb-0.5 border-b-2 border-transparent'}>Pinturas</button>
                            <button onClick={() => setSection('sobre')} className={section === 'sobre' ? 'text-ouro border-b-2 border-ouro' : 'text-slate-400 hover:text-ouro transition-colors pb-0.5 border-b-2 border-transparent'}>Sobre a Tay</button>
                        </div>
                    </nav>

                    <nav className="md:hidden fixed bottom-0 w-full h-20 glass-nav z-50 border-t flex justify-around items-center px-2 shadow-[0_-10px_20px_rgba(0,0,0,0.3)]">
                        <button onClick={() => setSection('inicio')} className={`flex flex-col items-center gap-1 ${section === 'inicio' ? 'text-ouro' : 'text-slate-400'}`}><span className="text-[10px] font-bold uppercase tracking-widest">Artes</span></button>
                        <button onClick={() => setSection('pinturas')} className={`flex flex-col items-center gap-1 ${section === 'pinturas' ? 'text-ouro' : 'text-slate-400'}`}><span className="text-[10px] font-bold uppercase tracking-widest">Pinturas</span></button>
                        <button onClick={() => setSection('sobre')} className={`flex flex-col items-center gap-1 ${section === 'sobre' ? 'text-ouro' : 'text-slate-400'}`}><span className="text-[10px] font-bold uppercase tracking-widest">Sobre</span></button>
                    </nav>

                    <main className="relative z-10 max-w-5xl mx-auto px-6 py-12 pt-32 md:pt-12 fade-in">
                        {section === 'inicio' && (
                            <div className="space-y-24">
                                <header className="text-center space-y-8 pt-8">
                                    <div className="flex justify-center mb-10"><LogoOficina size={180} /></div>
                                    <h1 className="font-serif text-4xl md:text-7xl font-bold tracking-tighter block leading-none text-ouro">Arte Feita à Mão com Alma e Magia</h1>
                                    <h2 className="font-serif text-xl md:text-2xl text-slate-300 block">Bem-vindo(a) à Oficina da Lua!</h2>
                                    <p className="font-sans text-lg text-slate-400 max-w-3xl mx-auto leading-relaxed block font-light">Meu trabalho é um mergulho nos mundos do desenho, da pintura e da cerâmica, criando peças únicas que levam mais cor e afeto para o seu cotidiano.</p>
                                </header>

                                <div className="space-y-12">
                                    <div className="flex justify-between items-end border-b border-ouro/20 pb-4">
                                        <h3 className="font-serif text-3xl font-bold tracking-tighter text-ouro">Cerâmica e Biscuit</h3>
                                    </div>
                                    {arts.length === 0 ? (
                                        <p className="text-slate-500 italic">Nenhuma peça de cerâmica no estoque no momento.</p>
                                    ) : (
                                        <div className="grid md:grid-cols-2 gap-10">
                                            {arts.map(art => (
                                                <div key={art.id} className="group bg-card border border-ouro/10 rounded-[2.5rem] overflow-hidden flex flex-col hover:border-ouro/50 transition-all shadow-xl">
                                                    <div className="aspect-[4/5] bg-slate-800 relative">
                                                        <img src={art.image} className="w-full h-full object-cover opacity-90 group-hover:opacity-100 group-hover:scale-105 transition-all duration-700" />
                                                    </div>
                                                    <div className="p-8 space-y-4 flex-1 flex flex-col">
                                                        <div className="flex justify-between items-start mb-2">
                                                            <h4 className="font-serif text-2xl font-bold text-ouro leading-tight">{art.name}</h4>
                                                            <div className="text-right ml-4 font-sans">
                                                                <span className="text-[10px] text-slate-400 block uppercase tracking-widest font-bold">Valor</span>
                                                                <span className="text-lg font-bold text-texto">R$ {art.price}</span>
                                                            </div>
                                                        </div>
                                                        <p className="font-sans text-slate-300 font-light block text-sm flex-1 leading-relaxed">{art.desc}</p>
                                                        <button onClick={() => {
                                                            document.getElementById('form-encomenda').scrollIntoView({ behavior: 'smooth' });
                                                            setOrderForm({...orderForm, type: 'Cerâmica / Biscuit', idea: `Olá! Amei a peça: ${art.name}`});
                                                        }} className="w-full font-sans text-[10px] uppercase tracking-[0.3em] font-bold border border-ouro/30 py-4 rounded-xl text-ouro mt-4 hover:bg-ouro hover:text-fundo transition-all">Encomendar Magia</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                <div id="form-encomenda" className="bg-card p-8 md:p-16 rounded-[3rem] border border-ouro/20 shadow-2xl relative overflow-hidden">
                                    <div className="max-w-xl mx-auto space-y-8 relative z-10">
                                        <div className="text-center space-y-4 mb-10">
                                            <h3 className="font-serif text-4xl md:text-5xl font-bold tracking-tighter text-ouro">Faça sua Encomenda</h3>
                                            <p className="font-sans text-slate-300 font-light text-lg">De cerâmicas a ilustrações, vamos transformar a sua imaginação em arte.</p>
                                        </div>
                                        <div className="grid gap-5">
                                            <input type="text" placeholder="Qual o seu nome?" className="form-input font-sans text-sm" 
                                                   value={orderForm.name} onChange={e => setOrderForm({...orderForm, name: e.target.value})} />
                                            <select className="form-input font-sans text-slate-300 text-sm" 
                                                    value={orderForm.type} onChange={e => setOrderForm({...orderForm, type: e.target.value})}>
                                                <option>Cerâmica / Biscuit</option>
                                                <option>Pintura / Ilustração</option>
                                                <option>Caderno Artesanal Personalizado</option>
                                                <option>Orçamento para Tatuagem</option>
                                            </select>
                                            <textarea placeholder="Me conte sua ideia! (Cores, referências, sentimentos da peça...)" 
                                                      className="form-input font-sans text-sm h-32 resize-none"
                                                      value={orderForm.idea} onChange={e => setOrderForm({...orderForm, idea: e.target.value})}></textarea>
                                            
                                            <button onClick={handleOrderSubmit} disabled={isSubmitting} className={`w-full bg-ouro text-fundo py-5 rounded-xl font-sans font-bold text-xs uppercase tracking-widest transition-all shadow-lg mt-2 ${isSubmitting ? 'opacity-50 cursor-not-allowed' : 'hover:bg-ouroclaro shadow-ouro/20'}`}>
                                                {isSubmitting ? 'Enviando ao Ateliê...' : 'Enviar Encomenda (WhatsApp)'}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {section === 'pinturas' && (
                            <div className="space-y-12 fade-in">
                                <div className="text-center space-y-8">
                                    <h2 className="font-serif text-5xl font-bold text-ouro">Galeria de Pinturas</h2>
                                    <p className="text-slate-300 font-light">Explorando o lado sombrio e sensível da estética.</p>
                                </div>
                                {paintings.length === 0 ? (
                                    <p className="text-slate-500 italic text-center">Nenhuma pintura no estoque no momento.</p>
                                ) : (
                                    <div className="grid md:grid-cols-2 gap-10">
                                        {paintings.map(paint => (
                                            <div key={paint.id} className="group bg-card border border-ouro/10 rounded-[2.5rem] overflow-hidden flex flex-col hover:border-ouro/50 transition-all shadow-xl">
                                                <div className="aspect-[4/5] bg-slate-800 relative">
                                                    <img src={paint.image} className="w-full h-full object-cover opacity-90 group-hover:opacity-100 group-hover:scale-105 transition-all duration-700" />
                                                </div>
                                                <div className="p-8 space-y-4 flex-1 flex flex-col">
                                                    <div className="flex justify-between items-start mb-2">
                                                        <h4 className="font-serif text-2xl font-bold text-ouro leading-tight">{paint.name}</h4>
                                                        <div className="text-right ml-4 font-sans">
                                                            <span className="text-[10px] text-slate-400 block uppercase tracking-widest font-bold">Valor</span>
                                                            <span className="text-lg font-bold text-texto">R$ {paint.price}</span>
                                                        </div>
                                                    </div>
                                                    <p className="font-sans text-slate-300 font-light block text-sm flex-1 leading-relaxed">{paint.desc}</p>
                                                    <button onClick={() => {
                                                        setSection('inicio');
                                                        setTimeout(() => document.getElementById('form-encomenda').scrollIntoView({ behavior: 'smooth' }), 100);
                                                        setOrderForm({...orderForm, type: 'Pintura / Ilustração', idea: `Olá! Quero a obra: ${paint.name}`});
                                                    }} className="w-full font-sans text-[10px] uppercase tracking-[0.3em] font-bold border border-ouro/30 py-4 rounded-xl text-ouro mt-4 hover:bg-ouro hover:text-fundo transition-all">Encomendar</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                        
                        {section === 'sobre' && (
                            <div className="text-center fade-in space-y-8 max-w-2xl mx-auto">
                                <h2 className="font-serif text-5xl font-bold text-ouro">Seja bem-vindo ao meu mundo</h2>
                                <p className="text-slate-300 font-light text-lg">Oi, eu sou a Tay! Aqui, a arte é a linguagem que uso para explorar a natureza, o misticismo e a beleza dos corpos femininos.</p>
                            </div>
                        )}
                    </main>

                    <footer className="py-20 text-center border-t border-ouro/10 mt-20 opacity-60 relative z-10">
                        <div className="flex justify-center mb-6"><LogoOficina size={70} /></div>
                        <div className="font-serif text-ouro text-lg tracking-widest flex items-center justify-center gap-2">Oficina <span className="font-hand lowercase">da</span> Lua</div>
                        <p className="font-sans text-[8px] uppercase tracking-[0.4em] mt-4 text-slate-500">Taylise Ink • 2026</p>
                        
                        <button onClick={navigateToAdmin} className="mt-8 text-slate-600 hover:text-ouro transition-colors" title="Acesso Restrito">
                            <svg className="w-4 h-4 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
                        </button>
                    </footer>
                </div>
            );
        };

        // ==========================================
        // ÁREA RESTRITA (ADMIN DASHBOARD)
        // ==========================================
        const AdminDashboard = ({ onLogout, user }) => {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [orders, setOrders] = useState([]);
            const [supplies, setSupplies] = useState([]);
            const [artworks, setArtworks] = useState([]);

            // Estado Form Insumos
            const [newSupName, setNewSupName] = useState('');
            const [newSupQty, setNewSupQty] = useState('');
            const [newSupUnit, setNewSupUnit] = useState('g');
            const [newSupThreshold, setNewSupThreshold] = useState('');
            
            // Estado Edição Rápida Insumos
            const [editingSupId, setEditingSupId] = useState(null);
            const [editingSupQty, setEditingSupQty] = useState('');

            // Estado Form Obras (Estoque)
            const [artForm, setArtForm] = useState({ name: '', desc: '', price: '', image: '', category: 'Cerâmica / Biscuit' });
            const [editingArtworkId, setEditingArtworkId] = useState(null); // ID da obra sendo editada

            // Estado Modal Encomenda
            const [isOrderModalOpen, setIsOrderModalOpen] = useState(false);
            const [editingOrder, setEditingOrder] = useState(null);
            const [orderForm, setOrderForm] = useState({ client: '', item: '', idea: '', status: 'Novo', deadline: '', price: '', cost: '' });

            // Busca de dados em tempo real
            useEffect(() => {
                if (!user) return;
                const { collection, onSnapshot } = window.fbMethods;
                
                const unsubOrders = onSnapshot(collection(window.fbDb, 'artifacts', appId, 'public', 'data', 'orders'), 
                    (snapshot) => {
                        const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        data.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                        setOrders(data);
                    }
                );

                const unsubSupplies = onSnapshot(collection(window.fbDb, 'artifacts', appId, 'public', 'data', 'supplies'), 
                    (snapshot) => setSupplies(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })))
                );

                const unsubArtworks = onSnapshot(collection(window.fbDb, 'artifacts', appId, 'public', 'data', 'artworks'), 
                    (snapshot) => setArtworks(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })))
                );

                return () => { unsubOrders(); unsubSupplies(); unsubArtworks(); };
            }, [user]);

            // --- CÁLCULOS FINANCEIROS ---
            const deliveredOrders = orders.filter(o => o.status === 'Entregue');
            const totalRevenue = deliveredOrders.reduce((sum, o) => sum + (Number(o.price) || 0), 0);
            const totalCost = deliveredOrders.reduce((sum, o) => sum + (Number(o.cost) || 0), 0);
            const totalProfit = totalRevenue - totalCost;

            // --- FUNÇÕES DE INSUMOS ---
            const getSupplyStatus = (qty, threshold) => {
                if (qty <= 0) return 'critico';
                if (qty <= threshold) return 'atencao';
                return 'ok';
            };

            const handleAddSupply = async (e) => {
                e.preventDefault();
                if (!newSupName) return;
                const qty = Number(newSupQty) || 0;
                const threshold = Number(newSupThreshold) || 0;
                
                const { addDoc, collection } = window.fbMethods;
                await addDoc(collection(window.fbDb, 'artifacts', appId, 'public', 'data', 'supplies'), {
                    name: newSupName, 
                    qty: qty, 
                    unit: newSupUnit,
                    threshold: threshold,
                    status: getSupplyStatus(qty, threshold)
                });
                setNewSupName(''); setNewSupQty(''); setNewSupThreshold('');
            };

            const handleSaveSupplyQty = async (id, threshold) => {
                const newQty = Number(editingSupQty) || 0;
                const newStatus = getSupplyStatus(newQty, threshold);
                
                const { updateDoc, doc } = window.fbMethods;
                await updateDoc(doc(window.fbDb, 'artifacts', appId, 'public', 'data', 'supplies', id), {
                    qty: newQty, status: newStatus
                });
                setEditingSupId(null);
            };

            const handleDeleteSupply = async (id) => {
                if(!confirm("Deletar insumo permanentemente?")) return;
                const { deleteDoc, doc } = window.fbMethods;
                await deleteDoc(doc(window.fbDb, 'artifacts', appId, 'public', 'data', 'supplies', id));
            };

            // --- FUNÇÕES DE ESTOQUE/OBRAS ---
            const handleAddArtwork = async (e) => {
                e.preventDefault();
                const { addDoc, updateDoc, doc, collection } = window.fbMethods;
                
                if (editingArtworkId) {
                    await updateDoc(doc(window.fbDb, 'artifacts', appId, 'public', 'data', 'artworks', editingArtworkId), {
                        ...artForm
                    });
                    setEditingArtworkId(null);
                    alert("Obra atualizada com sucesso!");
                } else {
                    await addDoc(collection(window.fbDb, 'artifacts', appId, 'public', 'data', 'artworks'), {
                        ...artForm, createdAt: new Date().toISOString()
                    });
                    alert("Obra adicionada ao site!");
                }
                setArtForm({ name: '', desc: '', price: '', image: '', category: 'Cerâmica / Biscuit' });
            };

            const handleEditArtwork = (art) => {
                setArtForm({ name: art.name, desc: art.desc, price: art.price, image: art.image, category: art.category });
                setEditingArtworkId(art.id);
                window.scrollTo({ top: 0, behavior: 'smooth' }); // Faz a tela rolar para cima para o form
            };

            const cancelEditArtwork = () => {
                setArtForm({ name: '', desc: '', price: '', image: '', category: 'Cerâmica / Biscuit' });
                setEditingArtworkId(null);
            };

            const handleDeleteArtwork = async (id) => {
                if(!confirm("Remover obra permanentemente do site público?")) return;
                const { deleteDoc, doc } = window.fbMethods;
                await deleteDoc(doc(window.fbDb, 'artifacts', appId, 'public', 'data', 'artworks', id));
            };

            // --- FUNÇÕES DE ENCOMENDAS ---
            const openOrderModal = (order = null) => {
                if (order) {
                    setEditingOrder(order.id);
                    setOrderForm({ ...order, price: order.price || '', cost: order.cost || '' });
                } else {
                    setEditingOrder(null);
                    setOrderForm({ client: '', item: '', idea: '', status: 'Novo', deadline: '', price: '', cost: '' });
                }
                setIsOrderModalOpen(true);
            };

            const handleSaveOrder = async (e) => {
                e.preventDefault();
                const { addDoc, updateDoc, doc, collection } = window.fbMethods;
                
                const finalOrderData = {
                    ...orderForm,
                    price: Number(orderForm.price) || 0,
                    cost: Number(orderForm.cost) || 0
                };

                if (editingOrder) {
                    await updateDoc(doc(window.fbDb, 'artifacts', appId, 'public', 'data', 'orders', editingOrder), finalOrderData);
                } else {
                    await addDoc(collection(window.fbDb, 'artifacts', appId, 'public', 'data', 'orders'), {
                        ...finalOrderData, createdAt: new Date().toISOString()
                    });
                }
                setIsOrderModalOpen(false);
            };

            const handleAdvanceOrder = async (id, currentStatus) => {
                const nextStatus = currentStatus === 'Novo' ? 'Produção' : currentStatus === 'Produção' ? 'Pronto' : 'Entregue';
                if (currentStatus === 'Entregue') return;
                const { updateDoc, doc } = window.fbMethods;
                await updateDoc(doc(window.fbDb, 'artifacts', appId, 'public', 'data', 'orders', id), { status: nextStatus });
            };

            const handleDeleteOrder = async (id) => {
                if(!confirm("Excluir esta encomenda permanentemente?")) return;
                const { deleteDoc, doc } = window.fbMethods;
                await deleteDoc(doc(window.fbDb, 'artifacts', appId, 'public', 'data', 'orders', id));
            };

            // --- LÓGICA DO CALENDÁRIO / AGENDA ---
            const renderAgenda = () => {
                const upcoming = orders.filter(o => o.deadline && o.status !== 'Entregue');
                
                const grouped = upcoming.reduce((acc, order) => {
                    const date = new Date(order.deadline + 'T12:00:00');
                    const monthYear = date.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
                    if (!acc[monthYear]) acc[monthYear] = [];
                    acc[monthYear].push(order);
                    return acc;
                }, {});

                const sortedMonths = Object.keys(grouped).sort((a, b) => {
                    return new Date(grouped[a][0].deadline) - new Date(grouped[b][0].deadline);
                });

                if (sortedMonths.length === 0) return <p className="text-gray-500 text-sm mt-4">Nenhum prazo definido no calendário para encomendas ativas.</p>;

                return (
                    <div className="mt-8 space-y-8">
                        {sortedMonths.map(month => (
                            <div key={month} className="relative pl-6 border-l-2 border-ouro/30">
                                <div className="absolute w-3 h-3 bg-ouro rounded-full -left-[7px] top-1"></div>
                                <h3 className="text-lg font-serif text-ouro capitalize mb-4">{month}</h3>
                                <div className="grid md:grid-cols-2 gap-4">
                                    {grouped[month].sort((a,b) => new Date(a.deadline) - new Date(b.deadline)).map(order => (
                                        <div key={order.id} className="bg-admincard border border-gray-700 p-4 rounded-lg shadow-lg">
                                            <div className="flex justify-between items-start mb-2">
                                                <div>
                                                    <span className="text-xs text-ouro font-bold uppercase tracking-widest block">{new Date(order.deadline + 'T12:00:00').toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'})}</span>
                                                    <h4 className="font-medium text-white">{order.client}</h4>
                                                </div>
                                                <span className={`text-[10px] px-2 py-1 rounded ${order.status === 'Produção' ? 'bg-yellow-900/50 text-yellow-400' : 'bg-blue-900/50 text-blue-400'}`}>{order.status}</span>
                                            </div>
                                            <p className="text-xs text-gray-400 truncate">{order.item}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                );
            };

            // --- LÓGICA DO HISTÓRICO DE VENDAS ---
            const renderHistory = () => {
                if (deliveredOrders.length === 0) return <p className="text-gray-500 text-sm mt-4">Nenhuma peça foi finalizada e entregue ainda.</p>;

                return (
                    <div className="mt-8">
                        <div className="bg-admincard rounded-xl border border-gray-800 overflow-hidden">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-gray-800/50 text-gray-400">
                                    <tr>
                                        <th className="p-4 font-normal">Cliente / Peça</th>
                                        <th className="p-4 font-normal">Data Finalização</th>
                                        <th className="p-4 font-normal">Valor</th>
                                        <th className="p-4 font-normal text-green-400">Lucro</th>
                                        <th className="p-4 font-normal text-right">Ações</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {deliveredOrders.map(order => (
                                        <tr key={order.id} className="border-t border-gray-800 hover:bg-gray-800/20">
                                            <td className="p-4">
                                                <div className="font-medium text-white">{order.client}</div>
                                                <div className="text-xs text-gray-500">{order.item}</div>
                                            </td>
                                            <td className="p-4 text-gray-400 text-xs">
                                                {order.deadline ? new Date(order.deadline + 'T12:00:00').toLocaleDateString('pt-BR') : 'Data não definida'}
                                            </td>
                                            <td className="p-4 text-white">R$ {Number(order.price || 0).toFixed(2)}</td>
                                            <td className="p-4 text-green-400 font-bold">R$ {(Number(order.price || 0) - Number(order.cost || 0)).toFixed(2)}</td>
                                            <td className="p-4 text-right">
                                                <button onClick={() => handleDeleteOrder(order.id)} className="text-xs text-red-500 hover:text-white px-2 py-1 rounded border border-red-900/50 hover:bg-red-900/50" title="Excluir Histórico">Excluir</button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-adminbg text-texto font-sans flex flex-col md:flex-row relative">
                    
                    {/* MODAL DE ENCOMENDAS */}
                    {isOrderModalOpen && (
                        <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex justify-center items-center p-4">
                            <div className="bg-admincard p-6 rounded-2xl w-full max-w-2xl border border-ouro/30 shadow-2xl overflow-y-auto max-h-[90vh]">
                                <h3 className="text-2xl font-serif text-ouro mb-4">{editingOrder ? 'Editar Encomenda' : 'Nova Encomenda'}</h3>
                                <form onSubmit={handleSaveOrder} className="space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs text-gray-400 uppercase mb-1">Cliente</label>
                                            <input type="text" className="admin-input" required value={orderForm.client} onChange={e => setOrderForm({...orderForm, client: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-400 uppercase mb-1">Prazo / Data (Opcional)</label>
                                            <input type="date" className="admin-input" value={orderForm.deadline} onChange={e => setOrderForm({...orderForm, deadline: e.target.value})} />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs text-gray-400 uppercase mb-1">Peça / Serviço</label>
                                        <input type="text" className="admin-input" required value={orderForm.item} onChange={e => setOrderForm({...orderForm, item: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-gray-400 uppercase mb-1">Ideia / Detalhes</label>
                                        <textarea className="admin-input h-20" required value={orderForm.idea} onChange={e => setOrderForm({...orderForm, idea: e.target.value})}></textarea>
                                    </div>
                                    
                                    {/* NOVOS CAMPOS FINANCEIROS */}
                                    <div className="grid grid-cols-2 gap-4 border-t border-gray-700 pt-4 mt-2">
                                        <div>
                                            <label className="block text-xs text-ouro uppercase mb-1">Valor Cobrado (R$)</label>
                                            <input type="number" step="0.01" className="admin-input" value={orderForm.price} onChange={e => setOrderForm({...orderForm, price: e.target.value})} placeholder="Ex: 150.00" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-red-400 uppercase mb-1">Custo Material (R$)</label>
                                            <input type="number" step="0.01" className="admin-input" value={orderForm.cost} onChange={e => setOrderForm({...orderForm, cost: e.target.value})} placeholder="Ex: 30.00" />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs text-gray-400 uppercase mb-1 mt-2">Status Atual</label>
                                        <select className="admin-input" value={orderForm.status} onChange={e => setOrderForm({...orderForm, status: e.target.value})}>
                                            <option>Novo</option>
                                            <option>Produção</option>
                                            <option>Pronto</option>
                                            <option>Entregue</option>
                                        </select>
                                    </div>
                                    <div className="flex justify-end gap-2 mt-6">
                                        <button type="button" onClick={() => setIsOrderModalOpen(false)} className="px-4 py-2 text-gray-400 hover:text-white text-sm">Cancelar</button>
                                        <button type="submit" className="px-6 py-2 bg-ouro text-adminbg font-bold rounded-lg text-sm">Salvar no Banco</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    <aside className="w-full md:w-64 bg-admincard border-r border-gray-800 flex flex-col">
                        <div className="p-6 border-b border-gray-800 flex items-center gap-3">
                            <LogoOficina size={40} />
                            <div>
                                <h2 className="font-serif text-ouro font-bold leading-tight">Ateliê<br/>Admin</h2>
                            </div>
                        </div>
                        <nav className="flex-1 p-4 space-y-2 text-sm">
                            <button onClick={() => setActiveTab('dashboard')} className={`w-full text-left px-4 py-3 rounded-lg transition-colors ${activeTab === 'dashboard' ? 'bg-ouro/10 text-ouro' : 'text-gray-400 hover:bg-gray-800'}`}>📅 Visão Geral & Finanças</button>
                            <button onClick={() => setActiveTab('encomendas')} className={`w-full text-left px-4 py-3 rounded-lg transition-colors flex justify-between ${activeTab === 'encomendas' ? 'bg-ouro/10 text-ouro' : 'text-gray-400 hover:bg-gray-800'}`}>
                                📦 Encomendas {orders.filter(o => o.status !== 'Entregue').length > 0 && <span className="bg-red-500 text-white text-[10px] px-2 py-0.5 rounded-full">{orders.filter(o => o.status !== 'Entregue').length}</span>}
                            </button>
                            <button onClick={() => setActiveTab('insumos')} className={`w-full text-left px-4 py-3 rounded-lg transition-colors ${activeTab === 'insumos' ? 'bg-ouro/10 text-ouro' : 'text-gray-400 hover:bg-gray-800'}`}>🎨 Insumos</button>
                            <button onClick={() => setActiveTab('estoque')} className={`w-full text-left px-4 py-3 rounded-lg transition-colors ${activeTab === 'estoque' ? 'bg-ouro/10 text-ouro' : 'text-gray-400 hover:bg-gray-800'}`}>🖼️ Estoque Site Público</button>
                        </nav>
                        <div className="p-4 border-t border-gray-800">
                            <button onClick={onLogout} className="w-full px-4 py-2 text-red-400 text-xs font-bold uppercase tracking-wider hover:bg-red-900/20 rounded-lg">Sair do Painel</button>
                        </div>
                    </aside>

                    <main className="flex-1 p-6 md:p-10 overflow-y-auto">
                        
                        {activeTab === 'dashboard' && (
                            <div className="space-y-10 fade-in">
                                <div>
                                    <h2 className="text-2xl font-serif text-white mb-6">Resumo do Ateliê</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                        <div className="bg-admincard p-6 rounded-xl border border-gray-800">
                                            <h3 className="text-gray-400 text-[10px] uppercase tracking-wider mb-2">Faturamento (Vendas Concluídas)</h3>
                                            <p className="text-2xl font-bold text-white">R$ {totalRevenue.toFixed(2)}</p>
                                        </div>
                                        <div className="bg-admincard p-6 rounded-xl border border-gray-800">
                                            <h3 className="text-gray-400 text-[10px] uppercase tracking-wider mb-2">Lucro Líquido Estimado</h3>
                                            <p className="text-2xl font-bold text-green-400">R$ {totalProfit.toFixed(2)}</p>
                                        </div>
                                        <div className="bg-admincard p-6 rounded-xl border border-gray-800">
                                            <h3 className="text-gray-400 text-[10px] uppercase tracking-wider mb-2">Obras à Venda (Site)</h3>
                                            <p className="text-2xl font-bold text-ouro">{artworks.length}</p>
                                        </div>
                                        <div className="bg-admincard p-6 rounded-xl border border-red-900/30">
                                            <h3 className="text-gray-400 text-[10px] uppercase tracking-wider mb-2">Alertas de Insumos</h3>
                                            <p className="text-2xl font-bold text-red-400">{supplies.filter(s => s.status !== 'ok').length}</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="pt-6 border-t border-gray-800">
                                    <h2 className="text-2xl font-serif text-white mb-2">Calendário de Entregas</h2>
                                    <p className="text-sm text-gray-400">Suas encomendas ativas e em produção, organizadas pela data limite.</p>
                                    {renderAgenda()}
                                </div>

                                <div className="pt-6 border-t border-gray-800">
                                    <h2 className="text-2xl font-serif text-white mb-2 flex items-center gap-2">
                                        Histórico de Vendas <span className="text-xs bg-green-900/50 text-green-400 px-2 py-1 rounded-full font-sans">{deliveredOrders.length} itens</span>
                                    </h2>
                                    <p className="text-sm text-gray-400">Tudo o que já foi marcado como 'Entregue' vem para cá.</p>
                                    {renderHistory()}
                                </div>
                            </div>
                        )}

                        {activeTab === 'encomendas' && (
                            <div className="space-y-6 fade-in">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-2xl font-serif text-white">Gestão de Encomendas</h2>
                                    <button onClick={() => openOrderModal()} className="bg-ouro text-adminbg px-4 py-2 rounded-lg text-xs font-bold hover:bg-ouroclaro">+ Adicionar Manualmente</button>
                                </div>
                                <div className="bg-admincard rounded-xl border border-gray-800 overflow-hidden">
                                    <table className="w-full text-left text-sm">
                                        <thead className="bg-gray-800/50 text-gray-400">
                                            <tr>
                                                <th className="p-4 font-normal w-1/4">Cliente</th>
                                                <th className="p-4 font-normal w-1/4">Peça/Ideia</th>
                                                <th className="p-4 font-normal">Prazo Definido</th>
                                                <th className="p-4 font-normal">Status</th>
                                                <th className="p-4 font-normal text-right">Ação</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {orders.filter(o => o.status !== 'Entregue').length === 0 ? (
                                                <tr><td colSpan="5" className="p-8 text-center text-gray-500">Nenhuma encomenda ativa na fila.</td></tr>
                                            ) : orders.filter(o => o.status !== 'Entregue').map(order => (
                                                <tr key={order.id} className="border-t border-gray-800 hover:bg-gray-800/20">
                                                    <td className="p-4 font-medium">{order.client}</td>
                                                    <td className="p-4">
                                                        <div className="text-ouro">{order.item}</div>
                                                        <div className="text-xs text-gray-500 mt-1 truncate max-w-[200px]" title={order.idea}>{order.idea}</div>
                                                    </td>
                                                    <td className="p-4 text-gray-400 text-xs">
                                                        {order.deadline ? new Date(order.deadline + 'T12:00:00').toLocaleDateString('pt-BR') : <span className="text-red-400/50 italic">Sem prazo</span>}
                                                    </td>
                                                    <td className="p-4">
                                                        <span className={`px-2 py-1 rounded text-xs 
                                                            ${order.status === 'Novo' ? 'bg-blue-900/50 text-blue-400' : ''}
                                                            ${order.status === 'Produção' ? 'bg-yellow-900/50 text-yellow-400' : ''}
                                                            ${order.status === 'Pronto' ? 'bg-green-900/50 text-green-400' : ''}
                                                        `}>
                                                            {order.status}
                                                        </span>
                                                    </td>
                                                    <td className="p-4 text-right space-x-2 flex justify-end">
                                                        <button onClick={() => openOrderModal(order)} className="text-xs text-gray-400 hover:text-white px-2 py-1 rounded border border-gray-700 hover:bg-gray-700">Editar</button>
                                                        <button onClick={() => handleAdvanceOrder(order.id, order.status)} className="text-xs bg-ouro/10 text-ouro px-2 py-1 rounded border border-ouro/30 hover:bg-ouro/20">Avançar ❯</button>
                                                        <button onClick={() => handleDeleteOrder(order.id)} className="text-xs text-red-500 hover:text-white px-2 py-1 rounded border border-red-900/50 hover:bg-red-900/50" title="Excluir">✕</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {activeTab === 'insumos' && (
                            <div className="space-y-6 fade-in">
                                <h2 className="text-2xl font-serif text-white">Controle de Insumos</h2>
                                
                                <form onSubmit={handleAddSupply} className="bg-admincard p-6 rounded-xl border border-gray-800 grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
                                    <div className="md:col-span-2">
                                        <label className="text-xs text-gray-400 uppercase mb-1 block">Novo Material</label>
                                        <input type="text" className="admin-input" value={newSupName} onChange={e => setNewSupName(e.target.value)} placeholder="Ex: Argila Branca" required />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-400 uppercase mb-1 block">Quantidade Atual</label>
                                        <input type="number" className="admin-input" value={newSupQty} onChange={e => setNewSupQty(e.target.value)} placeholder="Ex: 1000" required />
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-400 uppercase mb-1 block">Unidade</label>
                                        <select className="admin-input" value={newSupUnit} onChange={e => setNewSupUnit(e.target.value)}>
                                            <option value="g">Gramas (g)</option>
                                            <option value="ml">Mililitros (ml)</option>
                                            <option value="un">Unidades</option>
                                            <option value="kg">Quilos (kg)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs text-gray-400 uppercase mb-1 block text-[10px]">Avisar quando chegar em:</label>
                                        <input type="number" className="admin-input" value={newSupThreshold} onChange={e => setNewSupThreshold(e.target.value)} placeholder="Ex: 200" required />
                                    </div>
                                    <div className="md:col-span-5 flex justify-end">
                                        <button type="submit" className="bg-ouro text-adminbg font-bold px-6 py-2 rounded-lg text-sm hover:bg-ouroclaro">+ Adicionar Insumo</button>
                                    </div>
                                </form>

                                <div className="grid gap-3">
                                    {supplies.length === 0 ? (
                                        <p className="text-gray-500 text-center py-4">Seu estoque de insumos está vazio.</p>
                                    ) : supplies.map(sup => (
                                        <div key={sup.id} className="bg-admincard p-4 rounded-xl border border-gray-800 flex flex-col md:flex-row justify-between items-center group gap-4">
                                            <div className="flex-1 w-full">
                                                <h4 className="font-medium text-white text-lg flex items-center gap-2">
                                                    {sup.name} 
                                                    <span className="text-xs bg-gray-700 text-gray-300 px-2 py-0.5 rounded">Alerta em: {sup.threshold}{sup.unit}</span>
                                                </h4>
                                                <div className="mt-1">
                                                    {sup.status === 'ok' && <span className="text-[10px] text-green-400 uppercase tracking-widest font-bold">✓ Seguro</span>}
                                                    {sup.status === 'atencao' && <span className="text-[10px] text-yellow-400 uppercase tracking-widest font-bold">⚠️ Comprar logo</span>}
                                                    {sup.status === 'critico' && <span className="text-[10px] text-red-400 uppercase tracking-widest font-bold animate-pulse">❌ Faltando / Crítico!</span>}
                                                </div>
                                            </div>
                                            
                                            {/* SISTEMA DE EDIÇÃO DE QUANTIDADE */}
                                            <div className="flex items-center gap-3">
                                                {editingSupId === sup.id ? (
                                                    <div className="flex items-center gap-2 bg-gray-800 p-1 rounded-lg">
                                                        <input type="number" autoFocus className="admin-input w-24 text-center" value={editingSupQty} onChange={e => setEditingSupQty(e.target.value)} placeholder="Nova qtd" />
                                                        <span className="text-gray-400 text-sm">{sup.unit}</span>
                                                        <button onClick={() => handleSaveSupplyQty(sup.id, sup.threshold)} className="bg-green-600 text-white px-3 py-1.5 rounded text-xs font-bold hover:bg-green-500">Salvar</button>
                                                        <button onClick={() => setEditingSupId(null)} className="text-gray-400 px-2 hover:text-white text-xs">Cancelar</button>
                                                    </div>
                                                ) : (
                                                    <div className="flex items-center gap-4 bg-gray-800/50 px-4 py-2 rounded-lg border border-gray-700">
                                                        <span className="font-mono text-2xl text-ouro">{sup.qty} <span className="text-sm text-gray-400">{sup.unit}</span></span>
                                                        <button onClick={() => { setEditingSupId(sup.id); setEditingSupQty(sup.qty); }} className="text-xs bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded transition">✏️ Ajustar</button>
                                                    </div>
                                                )}

                                                <button onClick={() => handleDeleteSupply(sup.id)} className="text-gray-500 hover:text-red-500 transition px-2" title="Deletar da lista">
                                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'estoque' && (
                            <div className="space-y-6 fade-in">
                                <h2 className="text-2xl font-serif text-white">Obras no Site Público</h2>
                                <p className="text-sm text-gray-400">Gerencie as obras que estão disponíveis no seu portfólio público.</p>
                                
                                <form onSubmit={handleAddArtwork} className="bg-admincard p-6 rounded-xl border border-gray-800 grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs text-gray-400 uppercase mb-1">Nome da Obra</label>
                                        <input type="text" className="admin-input" required value={artForm.name} onChange={e => setArtForm({...artForm, name: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-gray-400 uppercase mb-1">Preço (Ex: 40,00)</label>
                                        <input type="text" className="admin-input" required value={artForm.price} onChange={e => setArtForm({...artForm, price: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-gray-400 uppercase mb-1">Categoria (Onde vai aparecer)</label>
                                        <select className="admin-input" value={artForm.category} onChange={e => setArtForm({...artForm, category: e.target.value})}>
                                            <option>Cerâmica / Biscuit</option>
                                            <option>Pintura / Ilustração</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs text-gray-400 uppercase mb-1">Link da Imagem (Ex: URL do Canva ou Unsplash)</label>
                                        <input type="url" className="admin-input" required value={artForm.image} onChange={e => setArtForm({...artForm, image: e.target.value})} />
                                    </div>
                                    <div className="md:col-span-2">
                                        <label className="block text-xs text-gray-400 uppercase mb-1">Descrição</label>
                                        <textarea className="admin-input" required value={artForm.desc} onChange={e => setArtForm({...artForm, desc: e.target.value})}></textarea>
                                    </div>
                                    <div className="md:col-span-2 flex gap-2 mt-2">
                                        <button type="submit" className="bg-ouro text-adminbg font-bold px-6 py-3 rounded-lg hover:bg-ouroclaro flex-1 transition">
                                            {editingArtworkId ? 'Salvar Alterações' : 'Publicar Nova Obra'}
                                        </button>
                                        {editingArtworkId && (
                                            <button type="button" onClick={cancelEditArtwork} className="bg-gray-700 text-white font-bold px-6 py-3 rounded-lg hover:bg-gray-600 transition">
                                                Cancelar Edição
                                            </button>
                                        )}
                                    </div>
                                </form>

                                <div className="grid md:grid-cols-3 gap-6 pt-4">
                                    {artworks.map(art => (
                                        <div key={art.id} className="bg-admincard border border-gray-800 rounded-xl overflow-hidden shadow-lg group flex flex-col">
                                            <div className="aspect-square bg-gray-900 relative">
                                                <img src={art.image} className="w-full h-full object-cover opacity-80" />
                                                <span className="absolute top-2 right-2 bg-black/80 text-white text-[10px] px-2 py-1 rounded uppercase tracking-widest">{art.category.split('/')[0]}</span>
                                            </div>
                                            <div className="p-4 flex flex-col gap-2 flex-1">
                                                <div>
                                                    <h4 className="font-serif text-lg text-ouro truncate" title={art.name}>{art.name}</h4>
                                                    <p className="text-sm text-white font-bold mb-2">R$ {art.price}</p>
                                                </div>
                                                <div className="flex gap-2 mt-auto pt-2">
                                                    <button onClick={() => handleEditArtwork(art)} className="flex-1 py-2 border border-gray-700 text-gray-300 rounded hover:bg-gray-700 text-xs font-bold uppercase transition">Editar</button>
                                                    <button onClick={() => handleDeleteArtwork(art.id)} className="flex-1 py-2 border border-red-900/50 text-red-400 rounded hover:bg-red-900/30 text-xs font-bold uppercase transition">Excluir</button>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            )
        };

        // ==========================================
        // COMPONENTE PRINCIPAL (ROTEADOR + AUTH)
        // ==========================================
        function App() {
            const [view, setView] = useState('public');
            const [user, setUser] = useState(null);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [firebaseReady, setFirebaseReady] = useState(!!window.fbAuth);

            useEffect(() => {
                if (!window.fbAuth) {
                    const handleReady = () => setFirebaseReady(true);
                    window.addEventListener('firebase-ready', handleReady);
                    return () => window.removeEventListener('firebase-ready', handleReady);
                }
            }, []);

            useEffect(() => {
                if (!firebaseReady) return;
                const { fbAuth, fbMethods: { onAuthStateChanged, signInAnonymously } } = window;
                
                const initAuth = async () => {
                    if (!fbAuth.currentUser) await signInAnonymously(fbAuth).catch(err => console.log(err));
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(fbAuth, setUser);
                return () => unsubscribe();
            }, [firebaseReady]);

            const handleLogin = async (e) => {
                e.preventDefault();
                try {
                    await window.fbMethods.signInWithEmailAndPassword(window.fbAuth, email, password);
                    setView('admin');
                } catch (error) {
                    alert("Acesso Negado. Verifique o email e senha cadastrados no Firebase.");
                }
            };

            const handleLogout = async () => {
                await window.fbMethods.signOut(window.fbAuth);
                setView('public');
                setEmail(''); setPassword('');
            };

            if (view === 'public') return <PublicSite navigateToAdmin={() => setView('login')} user={user} />;

            if (view === 'login') {
                return (
                    <div className="min-h-screen bg-adminbg flex flex-col justify-center items-center p-4">
                        <div className="bg-admincard p-8 rounded-2xl border border-gray-800 w-full max-w-md shadow-2xl fade-in">
                            <div className="flex justify-center mb-6"><LogoOficina size={80} /></div>
                            <h2 className="text-2xl font-serif text-ouro text-center mb-6">Acesso ao Ateliê</h2>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div><label className="block text-xs text-gray-400 uppercase tracking-widest mb-1">E-mail</label><input type="email" required className="admin-input" value={email} onChange={e => setEmail(e.target.value)} /></div>
                                <div><label className="block text-xs text-gray-400 uppercase tracking-widest mb-1">Senha</label><input type="password" required className="admin-input" value={password} onChange={e => setPassword(e.target.value)} /></div>
                                <button type="submit" className="w-full bg-ouro text-adminbg font-bold py-3 rounded-lg hover:bg-ouroclaro mt-4">Entrar no Painel</button>
                            </form>
                            <button onClick={() => setView('public')} className="w-full text-center text-xs text-gray-500 hover:text-white mt-6">Voltar para o site</button>
                        </div>
                    </div>
                );
            }

            if (view === 'admin' && user && !user.isAnonymous) return <AdminDashboard onLogout={handleLogout} user={user} />;
            else if (view === 'admin') setView('login');

            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
